[package]
name = "nac-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Native NAC desktop client drawn with Rune; talks to nac-web over HTTP and SSE."

# Standalone on purpose: NAC's root workspace and lockfile stay untouched.
[workspace]

[[bin]]
name = "nac-desktop"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "93fa605ca3e271a7b0873921f80a5db5df2aa575" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "93fa605ca3e271a7b0873921f80a5db5df2aa575", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["crates/nac-core", "crates/nac-server", "crates/nac-catalog-gen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
nac-core = { path = "crates/nac-core" }
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "1.3.0", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false }
toml = "0.8"
uuid = "1"

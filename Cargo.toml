[workspace]
members = ["crates/nac-core", "crates/nac-server", "crates/nac-catalog-gen"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "1.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false }
toml = "0.8"
utoipa = "5.5"
uuid = "1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Keep this list high-signal and warning-free so `make lint` remains a hard gate.
# Pedantic/nursery and panic-style lints can be enabled incrementally as their
# existing backlog is paid down.
dbg_macro = "warn"
rest_pat_in_fully_bound_structs = "warn"
todo = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
wildcard_dependencies = "warn"

name: Managed NAC image

on:
  pull_request:
    paths:
      - .github/workflows/managed-image.yml
      - .dockerignore
      - docker/managed/**
      - scripts/smoke-managed-image.sh
      - scripts/test-managed-image-contract.sh
      - Cargo.toml
      - Cargo.lock
      - crates/**
  push:
    branches: [main]
    paths:
      - .github/workflows/managed-image.yml
      - .dockerignore
      - docker/managed/**
      - scripts/smoke-managed-image.sh
      - scripts/test-managed-image-contract.sh
      - Cargo.toml
      - Cargo.lock
      - crates/**
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: managed-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
      - id: candidate
        name: Resolve immutable candidate
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

  contract:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image, entrypoint, smoke, and workflow contracts
        run: |
          sh -n docker/managed/entrypoint.sh
          sh -n scripts/smoke-managed-image.sh
          sh -n scripts/test-managed-image-contract.sh
          sh scripts/test-managed-image-contract.sh

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Install Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: crates/nac-server/web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix crates/nac-server/web ci
      - name: Run the repository acceptance gates
        run: make ci

  build-smoke:
    needs: [prepare, contract, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build exact linux/amd64 image without publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/managed/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nac-managed-smoke:${{ needs.prepare.outputs.short_sha }}
          provenance: false
          sbom: false
      - name: Run credential-independent image smoke
        env:
          MANAGED_IMAGE: nac-managed-smoke:${{ needs.prepare.outputs.short_sha }}
          MANAGED_IMAGE_SKIP_BUILD: "1"
        run: sh scripts/smoke-managed-image.sh

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [prepare, contract, quality, build-smoke]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Validate dev publication inputs
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          OIDC_ROLE_TO_ASSUME: ${{ secrets.OIDC_ROLE_TO_ASSUME }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECR_CACHE_REPOSITORY: ${{ vars.ECR_CACHE_REPOSITORY }}
        run: |
          for name in AWS_REGION OIDC_ROLE_TO_ASSUME ECR_REPOSITORY ECR_CACHE_REPOSITORY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Managed NAC dev environment is missing $name"
              exit 1
            fi
          done
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.OIDC_ROLE_TO_ASSUME }}
      - id: ecr
        name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        name: Compose immutable image reference
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          tag="$REGISTRY/$REPOSITORY:sha-$CANDIDATE_SHA-run-$RUN_ID-attempt-$RUN_ATTEMPT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: publish
        name: Publish exact linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/managed/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_CACHE_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_CACHE_REPOSITORY }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable publication
        env:
          IMAGE: ${{ steps.metadata.outputs.tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### Managed NAC image"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

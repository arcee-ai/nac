name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: Full commit SHA currently at the tip of dev
        required: true
        type: string
  pull_request:
    branches: [dev]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-please-dev
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact current dev source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.dev_sha }}
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          DEV_SHA="$(git rev-parse refs/remotes/origin/dev)" \
            node .github/scripts/release-policy.mjs validate-prepare

      # Human/platform prerequisite: install the narrowly scoped GitHub App on
      # this repository with Contents:write, Pull requests:write, and
      # Issues:write, expose its
      # app id as this repository variable, and store its private key as this
      # repository secret. The App token ensures its PR and release events run
      # normal CI; no PAT or AWS credential belongs in public NAC.
      - name: Mint repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nac
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Bind Release Please to the selected source
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.dev_sha }}
        run: .github/scripts/stable-release-preparation.sh stage

      - name: Prepare stable release PR only
        id: prepare
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: release-preparation-source
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Retarget the prepared PR to dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.dev_sha }}
        run: .github/scripts/stable-release-preparation.sh finalize

      - name: Require preparation to remain non-publishing
        env:
          RELEASE_CREATED: ${{ steps.prepare.outputs.release_created }}
        run: test "$RELEASE_CREATED" != true

  release-candidate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-please--branches--release-preparation-source--components--nac'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Bind the merged release PR candidate before security evaluation
        id: identity
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          [[ "$MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  source-security:
    needs: release-candidate
    uses: ./.github/workflows/source-security.yml
    with:
      candidate-sha: ${{ needs.release-candidate.outputs.sha }}
      policy-mode: publication

  publish-approved-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-please--branches--release-preparation-source--components--nac'
    needs: [release-candidate, source-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked release tooling without lifecycle scripts
        run: npm --prefix .github/scripts ci --ignore-scripts
      - name: Verify release policy and exact-plan publication contracts
        run: node --test .github/scripts/release-policy.test.mjs .github/scripts/source-release.test.mjs
      - name: Mint repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nac
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Publish only the exact scanned stable release plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCANNED_SHA: ${{ needs.release-candidate.outputs.sha }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/source-release.mjs

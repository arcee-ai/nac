name: Source dependency security

on:
  workflow_call:
    inputs:
      candidate-sha:
        type: string
        required: true
      trusted-policy-sha:
        type: string
        default: ''
      policy-mode:
        type: string
        default: ordinary

permissions:
  contents: read

jobs:
  scan:
    name: Full locked source scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require immutable candidate and policy identities
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          POLICY_SHA: ${{ inputs.trusted-policy-sha }}
          POLICY_MODE: ${{ inputs.policy-mode }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$POLICY_MODE" in
            ordinary) [[ "$POLICY_SHA" =~ ^[a-f0-9]{40}$ ]] ;;
            publication) test -z "$POLICY_SHA" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate-sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Pin canonical reviewed-dev policy for eligible publication events
        if: inputs.policy-mode == 'publication'
        id: publication-policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          REQUESTED_POLICY_SHA: ${{ inputs.trusted-policy-sha }}
        run: |
          node candidate/.github/scripts/publication-policy.mjs resolve "$CANDIDATE_SHA" \
            "$GITHUB_WORKSPACE/reports" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.publication-policy.outputs.sha || inputs.trusted-policy-sha }}
          path: trusted-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: sh candidate/.github/scripts/install-osv-scanner.sh "$RUNNER_TEMP/osv-scanner"
      - name: Test candidate security contracts and live safe/vulnerable fixtures
        run: |
          OSV_SCANNER="$RUNNER_TEMP/osv-scanner" node --test \
            candidate/.github/scripts/security-policy.test.mjs candidate/.github/scripts/source-security.test.mjs \
            candidate/.github/scripts/source-security-bundles.test.mjs candidate/.github/scripts/publication-policy.test.mjs
      - name: Verify exact release publication contract with the locked library
        run: |
          npm --prefix candidate/.github/scripts ci --ignore-scripts
          cd candidate
          node --test .github/scripts/source-release.test.mjs .github/scripts/source-security-workflow.test.mjs
      - name: Scan the complete candidate graph with reviewed base policy
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          POLICY_SHA: ${{ steps.publication-policy.outputs.sha || inputs.trusted-policy-sha }}
          POLICY_MODE: ${{ inputs.policy-mode }}
          NAC_PUBLICATION_POLICY_SHA: ${{ steps.publication-policy.outputs.sha }}
        run: |
          mkdir -p reports
          printf 'Candidate: %s\nTrusted policy: %s\n' "$CANDIDATE_SHA" "$POLICY_SHA" > reports/identity.txt
          extra=()
          if [ "$POLICY_MODE" = publication ]; then
            extra=(--publication-policy "$GITHUB_WORKSPACE/reports/publication-policy.json")
          fi
          node candidate/.github/scripts/source-security.mjs \
            "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/trusted-policy" \
            "$GITHUB_WORKSPACE/reports" "$RUNNER_TEMP/osv-scanner" "${extra[@]}"
      - name: Retain concise findings in the run summary
        if: always()
        run: |
          if [ -f reports/source-security.md ]; then
            cat reports/identity.txt reports/source-security.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Source security did not complete; inspect the failed setup/test/scan step. This is a failed gate, including during initial trusted-policy bootstrap.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-security-${{ inputs.candidate-sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

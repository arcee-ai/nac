name: Prepared single native command fixture90

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native346-command-runtime90-a93b1fb836ecc587b3cc4696b9e66838e7e5753d
  cancel-in-progress: false

jobs:
  command:
    if: github.repository == 'arcee-ai/nac' && github.actor == 'allisoneer' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SOURCE_SHA: a93b1fb836ecc587b3cc4696b9e66838e7e5753d
      CONTROLLER_SHA256: d9dd34ba7a5ae9866674f1986070917fd2bb14fb21871995e63c06ba2af61c0f
    steps:
      - name: Check out frozen clean Source89
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: a93b1fb836ecc587b3cc4696b9e66838e7e5753d
          path: source89
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Restore canonical Rust cache without writing it
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: source89 -> target
          shared-key: native-exact-qualification
          prefix-key: nac-ci-v1
          save-if: false
      - name: Materialize and verify literal controller
        shell: bash
        env:
          CONTROLLER_B64: 
        run: |
          python3 -B - <<'PYCONTROLLER'
          import base64, hashlib, os
          from pathlib import Path
          data = base64.b64decode(os.environ['CONTROLLER_B64'], validate=True)
          assert hashlib.sha256(data).hexdigest() == os.environ['CONTROLLER_SHA256']
          path = Path(os.environ['RUNNER_TEMP']) / 'native346-command-runtime90.py'
          with path.open('xb') as stream:
              stream.write(data)
          path.chmod(0o700)
          PYCONTROLLER
      - name: One owner call with internal SDK build and conditional one command actor
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = arcee-ai/nac
          test "$GITHUB_ACTOR" = allisoneer
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 -B "$RUNNER_TEMP/native346-command-runtime90.py" \
            --source-root "$GITHUB_WORKSPACE/source89" \
            --controller-sha256 "$CONTROLLER_SHA256" \
            --output "$RUNNER_TEMP/native346-command-runtime90-evidence"
      - name: Retain only bounded redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native346-runtime90-a93b1fb836ecc587b3cc4696b9e66838e7e5753d-${{ github.run_id }}
          path: ${{ runner.temp }}/native346-command-runtime90-evidence
          if-no-files-found: error
          retention-days: 7

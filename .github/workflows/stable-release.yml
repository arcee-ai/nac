# NEVER MERGE: one private PR544 fixture60 timing diagnostic; workflow id 353798970.
name: Private fixture60 timing diagnostic
on:
  workflow_dispatch:
    inputs:
      timing-custody:
        description: Exact Root single-use frozen source and original queue-inclusive clocks
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: private-native544-fixture60-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  fixture-timing:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/private-native544-fixture60-timing02' && github.run_attempt == 1 }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      NAC544_ROOT_CUSTODY: ${{ inputs['timing-custody'] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require original queue-inclusive Root allocation before bootstrap
        run: python3 -B .github/scripts/native544-fixture60/driver.py --admit-only
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: native-app
          prefix-key: nac-ci-v1
          save-if: "false"
      - name: Run exactly one original fixture60 with passive timing
        run: python3 -B .github/scripts/native544-fixture60/driver.py
      - name: Admit upload against the original hard cutoff
        id: upload_admission
        if: always()
        timeout-minutes: 1
        run: python3 -B .github/scripts/native544-fixture60/driver.py --upload-gate
      - name: Retain one bounded redacted timing artifact
        if: always() && steps.upload_admission.outputs.minutes != '' && steps.upload_admission.outputs.minutes != '0'
        timeout-minutes: ${{ fromJSON(steps.upload_admission.outputs.minutes) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native544-fixture60-${{ github.sha }}-${{ github.run_id }}-1
          path: ${{ runner.temp }}/native544-fixture60-upload
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

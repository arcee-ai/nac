name: Stable release

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      cold_caches:
        description: Measure Rust/image cache misses and bypass OS archive relay; run all acceptance work
        type: boolean
        required: false
        default: false
      native_qualification:
        description: One explicit immutable native supplier qualification
        type: choice
        default: none
        options:
          - none
          - all-341-macos26
          - all-343-macos26
          - all-351-macos14
          - all-352-macos26
          - all-342-startup-macos26
          - all-344-lifecycle-macos26
          - all-347-paths-macos26
      lifecycle_custody:
        description: Root-admitted ALL-344 custody JSON; required only for its fixed three-case qualification
        type: string
        required: false
        default: ""
      paths_custody:
        description: ROOT-issued ALL-347 allocation JSON with exact source, cases and original clock
        type: string
        required: false
        default: ""
      native-qualification:
        description: "Native-only qualification; none preserves ordinary CI"
        type: choice
        required: false
        default: none
        options: [none, all-347-paths-macos26]
      native-paths-custody:
        description: "Exact ROOT-issued one-use JSON with its original clock"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'edited' && github.event.changes.base == null)) && format('metadata-{0}-{1}', github.run_id, github.run_attempt) || (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action == 'synchronize' || github.event.changes.base != null) }}

jobs:
  ci-admission:
    name: ci-admission
    uses: ./.github/workflows/ci-admission.yml

  prepare:
    needs: ci-admission
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs['native-qualification'] == '' || inputs['native-qualification'] == 'none') }}
    runs-on: ubuntu-latest
    outputs:
      admission_mode: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && needs.ci-admission.result == 'success' && needs.ci-admission.outputs.mode == 'pure' && 'pure' || 'full' }}
      cold_caches: ${{ steps.cache-mode.outputs.cold_caches }}
      run: ${{ steps.stable.outputs.run || steps.ci.outputs.run }}
      sha: ${{ steps.stable.outputs.sha || steps.ci.outputs.sha }}
      version: ${{ steps.stable.outputs.version || steps.ci.outputs.version }}
      tag: ${{ steps.stable.outputs.tag }}
      managed_applicable: ${{ steps.applicability.outputs.managed_applicable }}
      source_policy_mode: ${{ steps.source-policy.outputs.mode }}
      source_policy_sha: ${{ steps.source-policy.outputs.policy_sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate stable release target
        id: stable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          source_sha="$(git rev-parse HEAD)"
          SOURCE_SHA="$source_sha" DEV_REF=refs/remotes/origin/dev node .github/scripts/release-policy.mjs validate-stable
          {
            echo "run=true"
            echo "sha=$source_sha"
            echo "version=$(tr -d '[:space:]' < version.txt)"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Capture CI source identity
        id: ci
        if: >-
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ github.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_ACTION: ${{ github.event.action }}
          CI_EVENT_BASE_CHANGED: ${{ toJSON(github.event.changes.base != null) }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          {
            echo "run=true"
            echo "sha=$SOURCE_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Select explicit cache-read measurement mode
        id: cache-mode
        env:
          DISPATCH_COLD_CACHES: ${{ toJSON(inputs.cold_caches) }}
        run: python3 .github/scripts/cold-caches.py >> "$GITHUB_OUTPUT"

      - name: Select ordinary base policy or publication-only resolution
        id: source-policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.stable.outputs.sha || steps.ci.outputs.sha }}
        run: node .github/scripts/publication-policy.mjs select "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Decide managed applicability from the complete merge diff
        id: applicability
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-paths"
            node .github/scripts/pr-checks.mjs applicability "$RUNNER_TEMP/pr-paths" >> "$GITHUB_OUTPUT"
          else
            echo 'managed_applicable=true' >> "$GITHUB_OUTPUT"
          fi

  workflow-lint:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Install locked workflow-parser dependencies
        run: npm --prefix .github/scripts ci --ignore-scripts
      - name: Resolve immutable startup console supplier
        id: startup-console-source
        run: python3 -B desktop/macos/ci_startup_console_check.py --resolve >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.startup-console-source.outputs.revision }}
          path: .startup-console-q
          persist-credentials: false
      - name: Require startup console producer and collector controls with zero skips
        run: python3 -B -m unittest discover -s desktop/macos -p "test_ci_startup_console_check.py" -v && python3 -B desktop/macos/ci_startup_console_check.py --source-root .startup-console-q
      - name: Check portable path adapter contracts without native execution
        run: python3 -B -m unittest discover -s desktop/macos -p 'test_ci_paths*.py' -v
      - name: Check workflows and scripts, then prove enforcement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint-workflows test-workflow-lint test-manual-stack-override

  lint:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          key: ${{ github.job }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Lint backend (frontend lint is part of test-assets)
        run: cargo clippy --workspace --locked --lib --bins -- -D warnings

      - name: Check frontend and backend formatting
        run: make format-check

  test-server:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          shared-key: server-browser-linux-gnu-debug0-v1
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Run nac-server tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/server-tests.py

      - name: Exercise stable binary readiness and status identity
        run: make test-stable-binary


  test-server-web:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          key: ${{ github.job }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Run frontend tests
        working-directory: crates/nac-server/web
        run: npm test

      # The build output is committed so that building nac-web never needs Node.
      # Rebuilding it here catches a commit that changed `web/` without shipping
      # the matching bundle.
      - name: Check generated API and every committed browser/client bundle
        run: make test-assets


  browser-binary:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.pack.outputs.receipt }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
      NAC_BUILD_TRACK: dev
      NAC_BUILD_ID: dev-${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          shared-key: server-browser-linux-gnu-debug0-v1
          save-if: "false"
      - name: Build and package the exact browser executable
        id: pack
        run: |
          : "${ImageOS:?missing runner OS}" "${ImageVersion:?missing runner image version}"
          test "$(git rev-parse HEAD)" = "$NAC_SOURCE_REVISION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          cargo build --locked -p nac-server --bin nac-web
          python3 .github/scripts/browser-binary.py pack \
            --binary "$GITHUB_WORKSPACE/target/debug/nac-web" \
            --output-dir "$GITHUB_WORKSPACE/browser-binary-upload" \
            --source "$NAC_SOURCE_REVISION" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --target x86_64-unknown-linux-gnu --rustc "$(rustc --version)" \
            --runner-image "$ImageOS@$ImageVersion" --github-output "$GITHUB_OUTPUT"
      - name: Retain same-run browser executable bytes
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-binary-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.archive }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  browser-apt:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      apt_mode: ${{ steps.apt-plan.outputs.mode || steps.apt-preflight.outputs.mode }}
      apt_receipt: ${{ steps.apt-export.outputs.receipt }}
      apt_artifact_id: ${{ steps.apt-upload.outputs.artifact-id }}
    env:
      NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Select same-run native package relay
        id: apt-preflight
        env:
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: python3 .github/scripts/browser-apt.py preflight --state "$RUNNER_TEMP/browser-apt" --source "$NAC_SOURCE_REVISION" --cold "$COLD_APT" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.apt-preflight.outputs.enabled == 'true'
        with:
          node-version: 24.22.1
      - name: Match native pager and locked browser setup for package authority
        if: steps.apt-preflight.outputs.enabled == 'true'
        run: |
          sudo apt-get update && sudo apt-get install --yes less
          npm --prefix crates/nac-server/web ci
      - name: Resolve fresh signed native package closure
        id: apt-plan
        if: steps.apt-preflight.outputs.enabled == 'true'
        run: python3 .github/scripts/browser-apt.py plan --state "$RUNNER_TEMP/browser-apt" --github-output "$GITHUB_OUTPUT"
      - name: Export authenticated same-run archive bytes
        id: apt-export
        if: steps.apt-plan.outputs.mode == 'ready'
        run: python3 .github/scripts/browser-apt.py export --state "$RUNNER_TEMP/browser-apt" --github-output "$GITHUB_OUTPUT"
      - name: Retain one package snapshot for this candidate and attempt
        id: apt-upload
        if: steps.apt-plan.outputs.mode == 'ready'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-apt-packages-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-apt/artifact/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain package producer identity and cost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-apt-evidence-producer-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-apt/
            !${{ runner.temp }}/browser-apt/**/*.deb
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  browser-shards:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.browser-binary.result == 'success' && needs.browser-apt.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, browser-binary, browser-apt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
      NAC_BUILD_TRACK: dev
      NAC_BUILD_ID: dev-${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: Validate browser artifact selection and current runner
        env:
          BROWSER_ARTIFACT_ID: ${{ needs.browser-binary.outputs.artifact_id }}
          BROWSER_BINARY_RECEIPT: ${{ needs.browser-binary.outputs.receipt }}
        run: |
          : "${ImageOS:?missing runner OS}" "${ImageVersion:?missing runner image version}"
          test "$(git rev-parse HEAD)" = "$NAC_SOURCE_REVISION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          [[ "$BROWSER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$BROWSER_BINARY_RECEIPT"
          printf 'Browser consumer runner image: %s@%s\n' "$ImageOS" "$ImageVersion"
          mkdir "$GITHUB_WORKSPACE/browser-binary-download"
      - name: Download only this producer's browser executable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.browser-binary.outputs.artifact_id }}
          path: browser-binary-download
          merge-multiple: true
      - name: Validate exact-run executable or select fresh source fallback
        id: binary
        env:
          BROWSER_BINARY_RECEIPT: ${{ needs.browser-binary.outputs.receipt }}
        run: |
          python3 .github/scripts/browser-binary.py consume \
            --archive "$GITHUB_WORKSPACE/browser-binary-download/browser-binary.tar.gz" \
            --output-dir "$GITHUB_WORKSPACE/browser-binary-runtime" \
            --receipt-env BROWSER_BINARY_RECEIPT \
            --source "$NAC_SOURCE_REVISION" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --target x86_64-unknown-linux-gnu --rustc "$(rustc --version)" \
            --runner-image "$ImageOS@$ImageVersion" --github-output "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.binary.outputs.mode == 'source'
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          shared-key: server-browser-linux-gnu-debug0-v1
          save-if: "false"
      - name: Rebuild current-attempt source after a valid older producer
        if: steps.binary.outputs.mode == 'source'
        run: cargo build --locked -p nac-server --bin nac-web
      - name: Select the verified current-attempt browser executable
        id: runtime
        env:
          BROWSER_BINARY_MODE: ${{ steps.binary.outputs.mode }}
          VERIFIED_BROWSER_BINARY: ${{ steps.binary.outputs.binary }}
        run: |
          case "$BROWSER_BINARY_MODE" in
            artifact) test -n "$VERIFIED_BROWSER_BINARY"; binary="$VERIFIED_BROWSER_BINARY" ;;
            source) binary="$GITHUB_WORKSPACE/target/debug/nac-web" ;;
            *) exit 1 ;;
          esac
          test -x "$binary"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Provision real terminal pager
        run: sudo apt-get update && sudo apt-get install --yes less
      - name: Install locked browser dependencies
        run: npm --prefix crates/nac-server/web ci
      # test-server-web separately proves the same candidate's committed bundles.
      - name: Select native package relay or controlled cold path
        id: apt-preflight
        env:
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: python3 .github/scripts/browser-apt.py preflight --state "$RUNNER_TEMP/browser-apt" --source "$NAC_SOURCE_REVISION" --cold "$COLD_APT" --github-output "$GITHUB_OUTPUT"
      - name: Resolve independent fresh signed package authority
        id: apt-plan
        if: steps.apt-preflight.outputs.enabled == 'true'
        run: python3 .github/scripts/browser-apt.py plan --state "$RUNNER_TEMP/browser-apt" --github-output "$GITHUB_OUTPUT"
      - name: Validate package selection before any download
        env:
          APT_MODE: ${{ needs.browser-apt.outputs.apt_mode }}
          APT_ID: ${{ needs.browser-apt.outputs.apt_artifact_id }}
          BROWSER_APT_RECEIPT: ${{ needs.browser-apt.outputs.apt_receipt }}
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: |
          case "$APT_MODE" in
            ready)
              test "$COLD_APT" = false
              [[ "$APT_ID" =~ ^[1-9][0-9]*$ ]]
              test -n "$BROWSER_APT_RECEIPT"
              mkdir "$RUNNER_TEMP/browser-apt-download"
              ;;
            disabled-cold)
              test "$COLD_APT" = true
              test -z "$APT_ID" && test -z "$BROWSER_APT_RECEIPT"
              ;;
            unsupported-platform|nothing-missing)
              test "$COLD_APT" = false
              test -z "$APT_ID" && test -z "$BROWSER_APT_RECEIPT"
              ;;
            *) exit 1 ;;
          esac
      - name: Download only the advertised current-run package snapshot
        if: needs.browser-apt.outputs.apt_mode == 'ready' && needs.prepare.outputs.cold_caches != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.browser-apt.outputs.apt_artifact_id }}
          path: ${{ runner.temp }}/browser-apt-download
          merge-multiple: true
      - name: Validate complete archive before compatibility fallback or offer
        id: apt-consume
        env:
          APT_MODE: ${{ needs.browser-apt.outputs.apt_mode }}
          BROWSER_APT_RECEIPT: ${{ needs.browser-apt.outputs.apt_receipt }}
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: |
          apt_download=()
          if [ "$APT_MODE" = ready ]; then apt_download=(--download "$RUNNER_TEMP/browser-apt-download"); fi
          python3 .github/scripts/browser-apt.py consume --state "$RUNNER_TEMP/browser-apt" --source "$NAC_SOURCE_REVISION"             --producer-mode "$APT_MODE" --cold "$COLD_APT" "${apt_download[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Offer only verified current package bytes to normal APT
        if: steps.apt-consume.outputs.mode == 'verified-offer'
        run: sudo python3 .github/scripts/browser-apt.py offer --state "$RUNNER_TEMP/browser-apt"
      - name: Install Playwright Chromium
        working-directory: crates/nac-server/web
        run: npx playwright install --with-deps chromium
      - name: Clean only exact offered package cache inodes
        if: always() && steps.apt-preflight.outcome == 'success'
        run: sudo python3 .github/scripts/browser-apt.py cleanup --state "$RUNNER_TEMP/browser-apt"
      - name: Record configured native packages and installed font bytes
        if: success() && steps.apt-plan.outputs.mode != ''
        run: python3 .github/scripts/browser-apt.py installed --state "$RUNNER_TEMP/browser-apt"
      - name: Run production-embedded browser shard
        env:
          NAC_E2E_BINARY: ${{ steps.runtime.outputs.binary }}
          NAC_E2E_ARTIFACTS: ${{ github.workspace }}/crates/nac-server/web/test-results
          BROWSER_SHARD: ${{ matrix.shard }}
        run: npm --prefix crates/nac-server/web run test:e2e -- --fully-parallel --grep-invert='exact-goal-wait.e2e.ts' --shard="$BROWSER_SHARD/8"
      - name: Upload selected elapsed interval evidence
        if: ${{ always() && hashFiles('crates/nac-server/web/test-results/**/elapsed-*.png', 'crates/nac-server/web/test-results/**/elapsed-qualification-*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nac-web-elapsed-interval-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-human-two-tasks.png
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-human-both-continued.png
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-model-native-two-tasks.png
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-model-native-both-continued.png
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-qualification-human.json
            crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/elapsed-qualification-model-native.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload browser shard failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nac-web-playwright-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            crates/nac-server/web/test-results
            !crates/nac-server/web/test-results/fresh-interval-tasks.e2e.t-*-ndependently-continues-both*/**
          if-no-files-found: ignore

      - name: Retain native package mode and cost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-apt-evidence-shard-${{ matrix.shard }}-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-apt/
            !${{ runner.temp }}/browser-apt/**/*.deb
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  browser-proof:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.browser-binary.result == 'success' && needs.browser-apt.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, browser-binary, browser-apt]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
      NAC_BUILD_TRACK: dev
      NAC_BUILD_ID: dev-${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - name: Validate browser artifact selection and current runner
        env:
          BROWSER_ARTIFACT_ID: ${{ needs.browser-binary.outputs.artifact_id }}
          BROWSER_BINARY_RECEIPT: ${{ needs.browser-binary.outputs.receipt }}
        run: |
          : "${ImageOS:?missing runner OS}" "${ImageVersion:?missing runner image version}"
          test "$(git rev-parse HEAD)" = "$NAC_SOURCE_REVISION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          [[ "$BROWSER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$BROWSER_BINARY_RECEIPT"
          printf 'Browser consumer runner image: %s@%s\n' "$ImageOS" "$ImageVersion"
          mkdir "$GITHUB_WORKSPACE/browser-binary-download"
      - name: Download only this producer's browser executable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.browser-binary.outputs.artifact_id }}
          path: browser-binary-download
          merge-multiple: true
      - name: Validate exact-run executable or select fresh source fallback
        id: binary
        env:
          BROWSER_BINARY_RECEIPT: ${{ needs.browser-binary.outputs.receipt }}
        run: |
          python3 .github/scripts/browser-binary.py consume \
            --archive "$GITHUB_WORKSPACE/browser-binary-download/browser-binary.tar.gz" \
            --output-dir "$GITHUB_WORKSPACE/browser-binary-runtime" \
            --receipt-env BROWSER_BINARY_RECEIPT \
            --source "$NAC_SOURCE_REVISION" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --target x86_64-unknown-linux-gnu --rustc "$(rustc --version)" \
            --runner-image "$ImageOS@$ImageVersion" --github-output "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: steps.binary.outputs.mode == 'source'
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          shared-key: server-browser-linux-gnu-debug0-v1
          save-if: "false"
      - name: Rebuild current-attempt source after a valid older producer
        if: steps.binary.outputs.mode == 'source'
        run: cargo build --locked -p nac-server --bin nac-web
      - name: Select the verified current-attempt browser executable
        id: runtime
        env:
          BROWSER_BINARY_MODE: ${{ steps.binary.outputs.mode }}
          VERIFIED_BROWSER_BINARY: ${{ steps.binary.outputs.binary }}
        run: |
          case "$BROWSER_BINARY_MODE" in
            artifact) test -n "$VERIFIED_BROWSER_BINARY"; binary="$VERIFIED_BROWSER_BINARY" ;;
            source) binary="$GITHUB_WORKSPACE/target/debug/nac-web" ;;
            *) exit 1 ;;
          esac
          test -x "$binary"
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Provision real terminal pager
        run: sudo apt-get update && sudo apt-get install --yes less
      - name: Install locked browser dependencies
        run: npm --prefix crates/nac-server/web ci
      # test-server-web separately proves the same candidate's committed bundles.
      - name: Select native package relay or controlled cold path
        id: apt-preflight
        env:
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: python3 .github/scripts/browser-apt.py preflight --state "$RUNNER_TEMP/browser-apt" --source "$NAC_SOURCE_REVISION" --cold "$COLD_APT" --github-output "$GITHUB_OUTPUT"
      - name: Resolve independent fresh signed package authority
        id: apt-plan
        if: steps.apt-preflight.outputs.enabled == 'true'
        run: python3 .github/scripts/browser-apt.py plan --state "$RUNNER_TEMP/browser-apt" --github-output "$GITHUB_OUTPUT"
      - name: Validate package selection before any download
        env:
          APT_MODE: ${{ needs.browser-apt.outputs.apt_mode }}
          APT_ID: ${{ needs.browser-apt.outputs.apt_artifact_id }}
          BROWSER_APT_RECEIPT: ${{ needs.browser-apt.outputs.apt_receipt }}
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: |
          case "$APT_MODE" in
            ready)
              test "$COLD_APT" = false
              [[ "$APT_ID" =~ ^[1-9][0-9]*$ ]]
              test -n "$BROWSER_APT_RECEIPT"
              mkdir "$RUNNER_TEMP/browser-apt-download"
              ;;
            disabled-cold)
              test "$COLD_APT" = true
              test -z "$APT_ID" && test -z "$BROWSER_APT_RECEIPT"
              ;;
            unsupported-platform|nothing-missing)
              test "$COLD_APT" = false
              test -z "$APT_ID" && test -z "$BROWSER_APT_RECEIPT"
              ;;
            *) exit 1 ;;
          esac
      - name: Download only the advertised current-run package snapshot
        if: needs.browser-apt.outputs.apt_mode == 'ready' && needs.prepare.outputs.cold_caches != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.browser-apt.outputs.apt_artifact_id }}
          path: ${{ runner.temp }}/browser-apt-download
          merge-multiple: true
      - name: Validate complete archive before compatibility fallback or offer
        id: apt-consume
        env:
          APT_MODE: ${{ needs.browser-apt.outputs.apt_mode }}
          BROWSER_APT_RECEIPT: ${{ needs.browser-apt.outputs.apt_receipt }}
          COLD_APT: ${{ needs.prepare.outputs.cold_caches }}
        run: |
          apt_download=()
          if [ "$APT_MODE" = ready ]; then apt_download=(--download "$RUNNER_TEMP/browser-apt-download"); fi
          python3 .github/scripts/browser-apt.py consume --state "$RUNNER_TEMP/browser-apt" --source "$NAC_SOURCE_REVISION"             --producer-mode "$APT_MODE" --cold "$COLD_APT" "${apt_download[@]}" --github-output "$GITHUB_OUTPUT"
      - name: Offer only verified current package bytes to normal APT
        if: steps.apt-consume.outputs.mode == 'verified-offer'
        run: sudo python3 .github/scripts/browser-apt.py offer --state "$RUNNER_TEMP/browser-apt"
      - name: Install Playwright Chromium
        working-directory: crates/nac-server/web
        run: npx playwright install --with-deps chromium
      - name: Clean only exact offered package cache inodes
        if: always() && steps.apt-preflight.outcome == 'success'
        run: sudo python3 .github/scripts/browser-apt.py cleanup --state "$RUNNER_TEMP/browser-apt"
      - name: Record configured native packages and installed font bytes
        if: success() && steps.apt-plan.outputs.mode != ''
        run: python3 .github/scripts/browser-apt.py installed --state "$RUNNER_TEMP/browser-apt"
      - name: Verify complete disjoint current browser selection
        working-directory: crates/nac-server/web
        run: |
          mkdir -p browser-inventory
          npx playwright test --list --reporter=json > browser-inventory/complete.json
          npx playwright test exact-goal-wait.e2e.ts --list --reporter=json > browser-inventory/proof.json
          for shard in 1 2 3 4 5 6 7 8; do
            npx playwright test --fully-parallel --grep-invert='exact-goal-wait.e2e.ts' --shard="$shard/8" --list --reporter=json > "browser-inventory/ordinary-$shard.json"
          done
          python3 ../../../.github/scripts/browser-inventory.py \
            --complete browser-inventory/complete.json --part browser-inventory/proof.json \
            --part browser-inventory/ordinary-1.json --part browser-inventory/ordinary-2.json \
            --part browser-inventory/ordinary-3.json --part browser-inventory/ordinary-4.json \
            --part browser-inventory/ordinary-5.json --part browser-inventory/ordinary-6.json \
            --part browser-inventory/ordinary-7.json --part browser-inventory/ordinary-8.json
      - name: Run production-embedded goal proof journeys
        env:
          NAC_E2E_BINARY: ${{ steps.runtime.outputs.binary }}
          NAC_E2E_ARTIFACTS: ${{ github.workspace }}/crates/nac-server/web/test-results
        run: npm --prefix crates/nac-server/web run test:e2e -- exact-goal-wait.e2e.ts
      - name: Stage only the two bounded ALL471 goal receipts
        if: always()
        env:
          GOAL_PROOF_SOURCE: ${{ needs.prepare.outputs.sha }}
          NAC_E2E_BINARY: ${{ steps.runtime.outputs.binary }}
        run: |
          python3 .github/scripts/browser-proof.py --root crates/nac-server/web/test-results --source "$GOAL_PROOF_SOURCE"
          python3 .github/scripts/browser-binary.py verify-proof \
            --binary "$NAC_E2E_BINARY" --source "$GOAL_PROOF_SOURCE" \
            --proof-dir crates/nac-server/web/test-results/all471-goal-proof-artifact
      - name: Retain only ALL471 goal proof and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: all471-goal-proof-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/nac-server/web/test-results/all471-goal-proof-artifact/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nac-web-playwright-proof-${{ github.run_attempt }}
          path: crates/nac-server/web/test-results
          if-no-files-found: ignore

      - name: Retain native package mode and cost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-apt-evidence-proof-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-apt/
            !${{ runner.temp }}/browser-apt/**/*.deb
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  browser:
    if: ${{ (always() && needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, browser-binary, browser-apt, browser-shards, browser-proof]
    runs-on: ubuntu-latest
    steps:
      - name: Require both producers, every browser shard and complete goal proof
        env:
          BINARY_RESULT: ${{ needs.browser-binary.result }}
          APT_RESULT: ${{ needs.browser-apt.result }}
          SHARD_RESULT: ${{ needs.browser-shards.result }}
          PROOF_RESULT: ${{ needs.browser-proof.result }}
        run: |
          test "$BINARY_RESULT" = success
          test "$APT_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$PROOF_RESULT" = success

  test-core:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          key: ${{ github.job }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1

      - name: Install pinned release-policy dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Run nac-core and nac-catalog-gen tests
        run: cargo test -p nac-core -p nac-catalog-gen --locked

      - name: Qualify isolated current-contents contract fixtures
        run: make test-capture-qualification

      - name: Test PR gates and rollout safeguards
        run: |
          node --test .github/scripts/pr-*.test.mjs
          python3 .github/scripts/browser-proof.test.py
          python3 .github/scripts/browser-inventory.test.py
          python3 .github/scripts/browser-binary.test.py
          python3 .github/scripts/ci-timings.test.py

      - name: Test stable release policy and configuration
        run: |
          bash -n .github/scripts/stable-release-preparation.sh
          sh -n .github/scripts/stable-release-rollout.sh
          node --test .github/scripts/release-policy.test.mjs

      - name: Test stable installer routing
        run: |
          sh -n scripts/install.sh
          sh .github/scripts/install.test.sh

  test-workspace:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          key: ${{ github.job }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      - name: Check startup fixture root custody without native processes
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Startup fixture controls require Python >= 3.11"; print(sys.version)'
          python3 -B -m unittest discover -s desktop/macos -p test_startup_custody.py -v
      - name: Test the other four workspace crates
        run: cargo test --locked -p nac-contracts -p nac-credential-store -p nac-managed -p nac-process
      - name: Preserve source, size, and lifecycle contracts on every PR
        run: |
          make test-nac-guide
          make test-source-size test-source-workflow test-source-binary
          make test-durability test-managed-load test-managed-image-contract

  quality:
    if: ${{ (always() && needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, lint, workflow-lint, test-server, test-server-web, test-core, test-workspace]
    runs-on: ubuntu-latest
    outputs:
      quality_receipt: ${{ steps.receipt.outputs.quality_receipt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Bind complete successful quality results to this candidate
        id: receipt
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: node .github/scripts/pr-checks.mjs quality-receipt >> "$GITHUB_OUTPUT"

  test:
    if: ${{ (always() && needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, quality, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require shared quality and real browser acceptance
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success

  build:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        id: release-cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ needs.prepare.outputs.cold_caches == 'true' && format('nac-ci-cold-{0}-{1}', github.run_id, github.run_attempt) || 'nac-ci-v1' }}
          key: ${{ github.job }}-${{ matrix.target }}-incremental16-v1
          cache-directories: ${{ github.workspace }}/.nac-ci-incremental-cache/${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

      - name: Restore verified compiler incremental data
        env:
          CARGO_INCREMENTAL: "1"
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci-incremental.py restore --workspace "$(pwd -P)" --target "$RELEASE_TARGET"

      - name: Build nac-web binary
        env:
          CARGO_INCREMENTAL: "1"
          NAC_BUILD_TRACK: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'dev' }}
          NAC_BUILD_ID: ${{ needs.prepare.outputs.tag || format('dev-{0}', needs.prepare.outputs.sha) }}
          NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          cargo build --release --locked \
            -p nac-server --bin nac-web \
            --target ${{ matrix.target }}

      - name: Package and verify archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/nac-web" dist/pkg/nac-web
          cp LICENSE dist/pkg/LICENSE
          tar -czf "dist/nac-${{ matrix.target }}.tar.gz" \
            -C dist/pkg nac-web LICENSE

          short_revision="$(git rev-parse --short=12 "$SOURCE_SHA")"
          test "$(dist/pkg/nac-web -V)" = "nac-web $RELEASE_VERSION"
          test "$(dist/pkg/nac-web --version)" = "nac-web $RELEASE_VERSION ($short_revision)"
          test "$(tar -tzf "dist/nac-${{ matrix.target }}.tar.gz" | sort)" = "$(printf 'LICENSE\nnac-web')"

      - name: Verify full release-local Guide identity
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          EXPECTED_TRACK: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'dev' }}
          EXPECTED_BUILD_ID: ${{ needs.prepare.outputs.tag || format('dev-{0}', needs.prepare.outputs.sha) }}
        run: |
          set -euo pipefail
          env -i PATH="$PATH" dist/pkg/nac-web guide skills discovery |
            python3 .github/scripts/release-identity.py \
              --version "$RELEASE_VERSION" --source "$SOURCE_SHA" \
              --track "$EXPECTED_TRACK" --build-id "$EXPECTED_BUILD_ID"

      - name: Stage trusted compiler incremental snapshot
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
          steps.release-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "1"
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/ci-incremental.py stage --workspace "$(pwd -P)" --target "$RELEASE_TARGET"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nac-${{ matrix.target }}
          path: dist/nac-${{ matrix.target }}.tar.gz

  macos-native:
    name: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure' && 'NAC metadata native omitted' || 'macos-native' }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.run == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    uses: ./.github/workflows/macos-native.yml
    with:
      cold_caches: ${{ needs.prepare.outputs.cold_caches == 'true' }}
      source-sha: ${{ needs.prepare.outputs.sha }}

  managed-image:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.managed_applicable == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    uses: ./.github/workflows/managed-image-build.yml
    with:
      cold_caches: ${{ needs.prepare.outputs.cold_caches == 'true' }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      policy_mode: ${{ needs.prepare.outputs.source_policy_mode }}
      trusted_policy_sha: ${{ needs.prepare.outputs.source_policy_sha }}

  managed-fault:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.managed_applicable == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    uses: ./.github/workflows/managed-fault.yml
    with:
      cold_caches: ${{ needs.prepare.outputs.cold_caches == 'true' }}
      source_sha: ${{ needs.prepare.outputs.sha }}

  managed-quality:
    needs: [prepare, quality, managed-fault]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.quality.result == 'success' && needs.managed-fault.result == 'success' && (needs.prepare.outputs.managed_applicable == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    uses: ./.github/workflows/managed-quality.yml
    with:
      cold_caches: ${{ needs.prepare.outputs.cold_caches == 'true' }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      quality_receipt: ${{ needs.quality.outputs.quality_receipt }}
      fault_receipt: ${{ needs.managed-fault.outputs.fault_receipt }}

  managed:
    if: ${{ (always() && needs.prepare.outputs.managed_applicable == 'true') && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, managed-image, managed-fault, managed-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Require exact-candidate image and complete managed fault quality
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: node .github/scripts/pr-checks.mjs managed-caller-aggregate

  source-security:
    name: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure' && 'NAC metadata source security omitted' || 'source-security' }}
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (true) && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: prepare
    uses: ./.github/workflows/source-security.yml
    with:
      candidate-sha: ${{ needs.prepare.outputs.sha }}
      policy-mode: ${{ needs.prepare.outputs.source_policy_mode }}
      trusted-policy-sha: ${{ needs.prepare.outputs.source_policy_sha }}

  required-pr-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs['native-qualification'] != '' && inputs['native-qualification'] != 'none' && 'Native-only aggregate excluded' || needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure' && 'NAC metadata checks omitted' || 'Required PR checks' }}
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs['native-qualification'] == '' || inputs['native-qualification'] == 'none') }}
    needs: [prepare, lint, test-server, test-server-web, test-core, test-workspace, quality, browser-binary, browser-apt, browser-shards, browser-proof, browser, test, build, managed-image, managed-fault, managed-quality, managed, source-security, workflow-lint, macos-native]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - if: ${{ !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - if: ${{ !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
        name: Require every applicable job from this run
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MANAGED_APPLICABLE: ${{ needs.prepare.outputs.managed_applicable }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node .github/scripts/pr-checks.mjs aggregate

  publish:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.required-pr-checks.result == 'success' && needs.source-security.result == 'success' && (needs.prepare.outputs.run == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && !(needs.prepare.result == 'success' && needs.prepare.outputs.admission_mode == 'pure') }}
    needs: [prepare, test, build, required-pr-checks, source-security]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: nac-*
          merge-multiple: true

      - name: Upload stable release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  native-qualification:
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/codex/') &&
      (inputs.native_qualification == 'all-341-macos26' || inputs.native_qualification == 'all-343-macos26' || inputs.native_qualification == 'all-351-macos14' || inputs.native_qualification == 'all-352-macos26' || inputs.native_qualification == 'all-342-startup-macos26' || inputs.native_qualification == 'all-344-lifecycle-macos26' || inputs.native_qualification == 'all-347-paths-macos26')
    uses: ./.github/workflows/macos-qualification.yml
    with:
      harness-sha: ${{ needs.prepare.outputs.sha }}
      target: ${{ inputs.native_qualification }}
      lifecycle-custody: ${{ inputs.lifecycle_custody || '' }}
      paths-custody: ${{ inputs.paths_custody || '' }}


  native-admission:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['native-qualification'] != '' && inputs['native-qualification'] != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate native-only dispatch before requesting a Mac runner
        id: admit
        working-directory: desktop/macos
        env:
          HARNESS_SHA: ${{ github.sha }}
          QUALIFICATION: ${{ inputs['native-qualification'] }}
          NAC_PATHS_CUSTODY_JSON: ${{ inputs['native-paths-custody'] }}
        run: |
          python3 -B - <<'PY'
          import os
          from ci_paths import validate_allocation
          from ci_paths_protocol import decode, require
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                  and os.environ['GITHUB_REF'].startswith('refs/heads/codex/')
                  and os.environ['GITHUB_RUN_ATTEMPT'] == '1'
                  and os.environ['GITHUB_SHA'] == os.environ['HARNESS_SHA']
                  and os.environ['QUALIFICATION'] == 'all-347-paths-macos26',
                  'first explicit codex path qualification only')
          data = os.environ['NAC_PATHS_CUSTODY_JSON'].encode()
          require(len(data) <= 8192, 'external custody JSON bound')
          validate_allocation(decode(data), os.environ['HARNESS_SHA'])
          PY


  native-exact:
    needs: native-admission
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['native-qualification'] == 'all-347-paths-macos26' }}
    uses: ./.github/workflows/macos-qualification.yml
    with:
      harness-sha: ${{ github.sha }}
      target: ${{ inputs['native-qualification'] }}
      paths-custody: ${{ inputs['native-paths-custody'] }}

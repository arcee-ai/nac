name: PRIVATE NEVERMERGE P12 integration bounded interaction four startup with R
run-name: PRIVATE NEVERMERGE P12 integration bounded interaction AX witness four startup

on:
  workflow_dispatch:
    inputs:
      startup_admission:
        description: Root exact four-case/R source/producer/artifact/original-clock admission
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  four_startup:
    if: github.repository == 'arcee-ai/nac' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/private520-new-candidate-exec-C13' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_STARTUP_ADMISSION: ${{ inputs.startup_admission }}
      H_ROOT: ${{ github.workspace }}/harness
      P_ROOT: ${{ github.workspace }}/product
      Q_ROOT: ${{ github.workspace }}/query
      R_ROOT: ${{ github.workspace }}/protocol
    steps:
      - name: Admit original clock and exact image before checkout or bootstrap
        id: initial
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, math, os, pathlib, time
          gate = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'native342-startup-gate'
          gate.mkdir(mode=0o700)
          report = dict(status='FAIL', observed_image=os.environ.get('ImageVersion'), compile=False, runtime=False)
          try:
              a = json.loads(os.environ['ROOT_STARTUP_ADMISSION'])
              assert set(a) == {'scope','controller_sha','allocation_id','attempt','retries','manifest_sha256','clock','producer'}
              assert a['scope'] == 'P12-integration-Qnew-candidate-exec-R7325-four-startup-source13' and a['controller_sha'] == os.environ['GITHUB_SHA']
              assert type(a['attempt']) is int and a['attempt'] == 1 and type(a['retries']) is int and a['retries'] == 0
              assert a['manifest_sha256'] == 'b1fb601ed4118029d538d0b9c673ecb927426a13651cb50a1befa279ed8cf70e'
              assert a['producer'] == dict(run_id=42455455480, artifact_id=13607980704, controller_sha='0210a3c52062ec28e9c6ae74098040e432e09a65', branch='codex/experimental-native-p12-lifecycle-package-20261108', artifact_name='ff8-host-package-42455455480-1')
              c = a['clock']; keys = ('STARTED','WORK_DEADLINE','CLEANUP_DEADLINE','HARD_DEADLINE')
              assert set(c) == set(keys) and all(type(c[k]) in (int,float) for k in keys)
              start,work,cleanup,hard = [c[k] for k in keys]; now = time.time()
              assert all(math.isfinite(x) for x in (start,work,cleanup,hard))
              assert start <= now < work < cleanup < hard and hard-start <= 3600 and work-start <= 2880
              assert cleanup-work >= 600 and hard-cleanup >= 120
              assert os.environ.get('ImageVersion') == '20261102.0473.1', 'different fleet image: unavailable, no fallback/retry'
              minutes = min(1, math.floor((work-now-60)/60)); assert minutes >= 1
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
                  for name,suffix in (('DOWNLOAD_ROOT','native342-download'), ('PACKAGE_ROOT','native342-package'), ('OUTPUT_ROOT','native342-episode')):
                      path = str(gate.parent / suffix)
                      assert '\n' not in path and '\r' not in path, 'single-line canonical runner path'
                      f.write(name+'='+path+'\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('minutes='+str(minutes)+'\n')
              report.update(status='PASS', clock=c, timeout_minutes=minutes)
          except BaseException as error:
              report['error_type'] = type(error).__name__
              raise
          finally:
              (gate/'initial.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.initial.outputs.minutes) }}
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Bound Rust bootstrap
        id: rust
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate rust
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        timeout-minutes: ${{ fromJSON(steps.rust.outputs.minutes) }}
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - name: Bound Node bootstrap
        id: node
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.node.outputs.minutes) }}
        with:
          node-version: 24.22.1
      - name: Bound H source checkout
        id: checkout_H
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate checkout-H
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.checkout_H.outputs.minutes) }}
        with:
          ref: ${{ steps.checkout_H.outputs.H }}
          path: harness
          persist-credentials: false
      - name: Bound P source checkout
        id: checkout_P
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate checkout-P
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.checkout_P.outputs.minutes) }}
        with:
          ref: ${{ steps.checkout_H.outputs.P }}
          path: product
          persist-credentials: false
      - name: Bound Q source checkout
        id: checkout_Q
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate checkout-Q
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.checkout_Q.outputs.minutes) }}
        with:
          ref: ${{ steps.checkout_H.outputs.Q }}
          path: query
          persist-credentials: false
      - name: Bound independent R source checkout
        id: checkout_R
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate checkout-R
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.checkout_R.outputs.minutes) }}
        with:
          ref: ${{ steps.checkout_H.outputs.R }}
          path: protocol
          persist-credentials: false
      - name: Bound metadata from original clock
        id: metadata
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate metadata
      - name: Verify exact successful producer run and artifact identity
        timeout-minutes: ${{ fromJSON(steps.metadata.outputs.minutes) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --metadata
      - name: Bound download from original clock
        id: download
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate download
      - name: Download only the Root-bound same-repository run and artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: ${{ fromJSON(steps.download.outputs.minutes) }}
        with:
          artifact-ids: ${{ steps.download.outputs.artifact_id }}
          run-id: ${{ steps.download.outputs.run_id }}
          repository: arcee-ai/nac
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native342-download
          merge-multiple: true
      - name: Bound prepare from original clock
        id: prepare
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate prepare
      - name: Verify sealed original manifest ZIP and extract without rebuilding
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --prepare
      - name: Bound required R and four cases from original clock
        id: episode
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native342-startup/launch.py --gate episode
      - name: Run maintained R and four serial startup cases with original cleanup reserve
        timeout-minutes: ${{ fromJSON(steps.episode.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native342-startup/four-startup.py
      - name: Bound always-retention to the original hard deadline
        id: retention
        if: always()
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, math, os, time
          minutes = 0
          try:
              c = json.loads(os.environ['ROOT_STARTUP_ADMISSION'])['clock']
              start,hard = c['STARTED'],c['HARD_DEADLINE']; now = time.time()
              assert all(type(x) in (int,float) and math.isfinite(x) for x in (start,hard))
              assert start <= now < hard and 0 < hard-start <= 3600
              minutes = max(0,min(2,math.floor((hard-now-15)/60)))
          except (KeyError,TypeError,ValueError,AssertionError): pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('minutes='+str(minutes)+'\n')
          PYCODE
      - name: Retain only bounded episode and gate evidence
        if: always() && steps.retention.outputs.minutes != '' && steps.retention.outputs.minutes != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: ${{ fromJSON(steps.retention.outputs.minutes) }}
        with:
          name: p12-ax-startup4-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native342-startup-gate
            ${{ runner.temp }}/native342-episode/evidence
          if-no-files-found: error
          retention-days: 3

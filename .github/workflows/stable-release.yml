name: PRIVATE NEVERMERGE P12 lifecycle composited capture
run-name: PRIVATE NEVERMERGE six held confirmation screens

on:
  workflow_dispatch:
    inputs:
      capture_admission:
        description: Literal separately issued Root capture custody and original clock
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  capture:
    if: github.repository == 'arcee-ai/nac' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/experimental-native-p12-lifecycle-capture-consumer01' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_LIFECYCLE_CAPTURE_ADMISSION: ${{ inputs.capture_admission }}
      P_ROOT: ${{ github.workspace }}/product
    steps:
      - name: Admit original clock and exact image before checkout or bootstrap
        id: initial
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, math, os, pathlib, re, time
          P='4b7a1f3e0bf6175a77c5ebf627fe965860e99976'
          CASES=('run','approval','terminal')
          Q_SHA256='e5826f078b27837a140b72c25648b5fc6386230c7e8ba051312a1cee41a453e1'
          BASE='ebdbd340bdc1220318446180c0a0df579489392c'
          SOURCE_PARENT='2af8c5bc3efcb6789ba164859699cc0b58d5200a'
          BRANCH='refs/heads/codex/experimental-native-p12-lifecycle-capture-consumer01'
          SCOPE='P12-six-composited-lifecycle-confirmations-source01'
          MANIFEST='1ddcf153b7dabeb82b3e662b8770ab57ea734566343e16496c4932c72391cf78'
          PRODUCER=dict(run_id=42455455480,artifact_id=13607980704,
              controller_sha='0210a3c52062ec28e9c6ae74098040e432e09a65',
              branch='codex/experimental-native-p12-lifecycle-package-20261108',
              artifact_name='ff8-host-package-42455455480-1')

          def require(value,reason):
              if not value:raise RuntimeError(reason)
          def closed(value,keys):
              require(type(value) is dict and set(value)==set(keys),'closed admission')
          def admit(value=None,env=None,*,now=None):
              env=os.environ if env is None else env
              if value is None:
                  text=env.get('ROOT_LIFECYCLE_CAPTURE_ADMISSION','')
                  require(0<len(text.encode())<=8192,'one bounded Root declaration')
                  def unique(pairs):
                      d={}
                      for k,v in pairs:require(k not in d,'duplicate admission key');d[k]=v
                      return d
                  value=json.loads(text,object_pairs_hook=unique)
              closed(value,('scope','controller_sha','H_base','P','Q_sha256','manifest_sha256','producer',
                  'allocation_id','admission_nonce','attempt','retries','prior_dispatch_counts','clock'))
              require(value['scope']==SCOPE and value['H_base']==BASE and value['P']==P
                  and value['Q_sha256']==Q_SHA256
                  and value['manifest_sha256']==MANIFEST,'fixed supplier/controller/driver role')
              require(type(value['controller_sha']) is str and re.fullmatch('[0-9a-f]{40}',value['controller_sha'])
                  and env.get('GITHUB_SHA')==value['controller_sha'] and env.get('GITHUB_REF')==BRANCH
                  and env.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and env.get('GITHUB_RUN_ATTEMPT')=='1'
                  and env.get('GITHUB_REPOSITORY')=='arcee-ai/nac'
                  and re.fullmatch('[1-9][0-9]*',env.get('GITHUB_RUN_ID','')),'exact first private manual job')
              require(type(value['allocation_id']) is str and re.fullmatch('[A-Za-z0-9_-]{1,100}',value['allocation_id'])
                  and type(value['admission_nonce']) is str and re.fullmatch('[0-9a-f]{64}',value['admission_nonce']), 'named Root custody')
              require(type(value['attempt']) is int and value['attempt']==1 and type(value['retries']) is int
                  and value['retries']==0 and value['prior_dispatch_counts']==dict.fromkeys(CASES,0)
                  and all(type(x) is int for x in value['prior_dispatch_counts'].values()),'unspent serial allocation')
              require(type(value['producer']) is dict and value['producer']==PRODUCER
                  and all(type(value['producer'][k]) is int for k in ('run_id','artifact_id')),'original producer identity')
              c=value['clock'];keys=('STARTED','WORK_DEADLINE','CLEANUP_DEADLINE','HARD_DEADLINE');closed(c,keys)
              require(all(type(c[k]) in (int,float) and math.isfinite(c[k]) for k in keys),'finite original clock')
              start,work,cleanup,hard=(c[k] for k in keys);stamp=time.time() if now is None else now
              require(start<=stamp<work<cleanup<hard and hard-start<=3600 and work-start<=2880
                  and cleanup-work>=600 and hard-cleanup>=120,'queue-inclusive original48+10+2 clock')
              return value

          root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()/'native344-capture-retained'
          root.mkdir(mode=0o700);gate=root/'caller';gate.mkdir(mode=0o700)
          report=dict(status='FAIL',compiler=False,runtime=False)
          try:
              value=admit()
              require(os.environ.get('GITHUB_WORKFLOW_REF')=='arcee-ai/nac/.github/workflows/stable-release.yml@'+BRANCH,'registered manual workflow')
              require(os.environ.get('GITHUB_JOB')=='capture' and os.environ.get('ImageVersion')=='20261102.0473.1','exact job/image before bootstrap')
              now=time.time();minutes=min(1,math.floor((value['clock']['WORK_DEADLINE']-now-60)/60));require(minutes>=1,'original checkout allowance')
              paths={'CAPTURE_RETAINED':root,'CAPTURE_GATE':gate}
              for key,suffix in [('CAPTURE_DOWNLOAD','native344-capture-download'),('CAPTURE_PACKAGE','native344-capture-package'),('CAPTURE_EPISODE','native344-capture-episode')]:paths[key]=root.parent/suffix
              with open(os.environ['GITHUB_ENV'],'a') as output:
                  for key,path in paths.items():
                      text=str(path);require('\n' not in text and '\r' not in text,'single-line known path');output.write(key+'='+text+'\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('minutes='+str(minutes)+'\n')
              report.update(status='PASS',clock=value['clock'],controller_sha=value['controller_sha'])
          finally:(gate/'initial.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.initial.outputs.minutes) }}
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 2
          persist-credentials: false
      - name: Bound rust to original clock
        id: rust
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate rust
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        timeout-minutes: ${{ fromJSON(steps.rust.outputs.minutes) }}
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - name: Bound node to original clock
        id: node
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.node.outputs.minutes) }}
        with:
          node-version: 24.22.1
      - name: Bound checkout-P to original clock
        id: checkout_P
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate checkout-P
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.checkout_P.outputs.minutes) }}
        with:
          ref: 4b7a1f3e0bf6175a77c5ebf627fe965860e99976
          path: product
          persist-credentials: false
      - name: Bound setup-controller to original clock
        id: setup_controller
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate setup-controller
      - name: Install locked dependencies in exact controller source
        timeout-minutes: ${{ fromJSON(steps.setup_controller.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --setup controller
      - name: Bound setup-P to original clock
        id: setup_P
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate setup-P
      - name: Install locked dependencies in exact P source
        timeout-minutes: ${{ fromJSON(steps.setup_P.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --setup P
      - name: Bound metadata to original clock
        id: metadata
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate metadata
      - name: Verify original producer and nonexpired exact artifact metadata
        timeout-minutes: ${{ fromJSON(steps.metadata.outputs.minutes) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --metadata
      - name: Bound download to original clock
        id: download
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate download
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: ${{ fromJSON(steps.download.outputs.minutes) }}
        with:
          artifact-ids: 13607980704
          run-id: 42455455480
          repository: arcee-ai/nac
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native344-capture-download
          merge-multiple: true
      - name: Bound prepare to original clock
        id: prepare
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate prepare
      - name: Validate closed original inventory and extract only original lifecycle role
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --prepare
      - name: Bound episode to original clock
        id: episode
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --gate episode
      - name: Execute actual consumer HEAD reviewed controller
        timeout-minutes: ${{ fromJSON(steps.episode.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --episode
      - name: Bound original hard-deadline retention
        id: retention
        if: always() && steps.initial.outcome == 'success'
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json,math,os,time
          minutes=0
          try:
              value=json.loads(os.environ['ROOT_LIFECYCLE_CAPTURE_ADMISSION']);c=value['clock'];start,hard=c['STARTED'],c['HARD_DEADLINE'];now=time.time()
              assert all(type(x) in (int,float) and math.isfinite(x) for x in (start,hard,now))
              assert start<=now<hard and 0<hard-start<=3600
              minutes=max(0,min(2,math.floor((hard-now-15)/60)))
          except (KeyError,TypeError,ValueError,AssertionError):pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('minutes='+str(minutes)+'\n')
          PYCODE
      - name: Combine existing evidence and bounded caller metadata inside one envelope
        if: always() && steps.retention.outputs.minutes != '' && steps.retention.outputs.minutes != '0'
        timeout-minutes: ${{ fromJSON(steps.retention.outputs.minutes) }}
        run: python3 -B controller/.github/scripts/native344-capture/caller.py --retain
      - name: Bound final upload again to SAME hard cutoff
        id: upload
        if: always() && steps.initial.outcome == 'success'
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json,math,os,time
          minutes=0
          try:
              value=json.loads(os.environ['ROOT_LIFECYCLE_CAPTURE_ADMISSION']);c=value['clock'];start,hard=c['STARTED'],c['HARD_DEADLINE'];now=time.time()
              assert all(type(x) in (int,float) and math.isfinite(x) for x in (start,hard,now))
              assert start<=now<hard and 0<hard-start<=3600
              minutes=max(0,min(2,math.floor((hard-now-15)/60)))
          except (KeyError,TypeError,ValueError,AssertionError):pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('minutes='+str(minutes)+'\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.upload.outputs.minutes != '' && steps.upload.outputs.minutes != '0'
        timeout-minutes: ${{ fromJSON(steps.upload.outputs.minutes) }}
        with:
          name: p12-lifecycle-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native344-capture-retained
          if-no-files-found: error
          retention-days: 3

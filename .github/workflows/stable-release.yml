name: Stable release
run-name: ALL-354 environment-only observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/all-354-xcode-environment-20261107'
    name: Observe full Xcode environment without builds or input
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact runner source and existing toolchain versions
        env:
          OBSERVED_SOURCE_SHA: ${{ github.sha }}
          OBSERVED_REF: ${{ github.ref }}
          OBSERVED_RUN_ID: ${{ github.run_id }}
          OBSERVED_RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVATION_OUTPUT: ${{ runner.temp }}/nac-xcode-environment
        run: |
          python3 -B - <<'PY'
          import datetime, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['OBSERVATION_OUTPUT'])
          output.mkdir(mode=0o700)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          identity = {key: os.environ.get(key) for key in (
              'OBSERVED_SOURCE_SHA', 'OBSERVED_REF', 'OBSERVED_RUN_ID', 'OBSERVED_RUN_ATTEMPT',
              'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_NAME', 'ImageOS', 'ImageVersion', 'DEVELOPER_DIR')}
          identity.update(checked_out_sha=source,
                          developer_path_exists=pathlib.Path(os.environ['DEVELOPER_DIR']).is_dir())
          observations = []
          failure = (source != identity['OBSERVED_SOURCE_SHA']
                     or identity['OBSERVED_RUN_ATTEMPT'] != '1'
                     or not identity['developer_path_exists'])
          commands = [
              ['uname', '-a'], ['uname', '-m'], ['sw_vers', '-productVersion'], ['sw_vers', '-buildVersion'],
              ['xcode-select', '-p'], ['xcrun', '--find', 'xcodebuild'], ['xcodebuild', '-version'],
              ['xcrun', '--find', 'swiftc'], ['xcrun', 'swiftc', '--version'],
              ['xcrun', '--sdk', 'macosx', '--show-sdk-version'],
              ['xcrun', '--sdk', 'macosx', '--show-sdk-path'],
          ]
          for argv in commands:
              row = {'argv': argv}
              try:
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=30)
                  row.update(returncode=result.returncode, stdout=result.stdout, stderr=result.stderr)
                  failure = failure or result.returncode != 0
              except (OSError, subprocess.TimeoutExpired) as error:
                  row.update(error=type(error).__name__, detail=str(error))
                  failure = True
              observations.append(row)
              print(json.dumps(row, ensure_ascii=False), flush=True)
          receipt = dict(at=datetime.datetime.now(datetime.timezone.utc).isoformat(), identity=identity,
                         observations=observations, observation_complete=not failure,
                         qualification=False, compile=False, native_case=False, input=False)
          encoded = (json.dumps(receipt, indent=2) + '\n').encode()
          if len(encoded) > 256 * 1024:
              raise RuntimeError('Environment observation exceeded its fixed bound')
          (output / 'environment-observation.json').write_bytes(encoded)
          print(json.dumps(identity), flush=True)
          raise SystemExit(1 if failure else 0)
          PY
      - name: Retain raw bounded environment observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nac-xcode-environment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nac-xcode-environment
          if-no-files-found: error
          retention-days: 7

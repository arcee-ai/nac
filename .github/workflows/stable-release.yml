name: Private Linux PTY identity RED GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-pty-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Prepare locked dependencies
        run: make setup
      - name: Verify exact Linux owner GREEN old behavior RED restored GREEN
        run: |
          python3 - <<'PYCONTROL'
          """One-shot Linux owner RED/GREEN qualification; never a shipping repository file."""
          import hashlib
          import os
          from pathlib import Path
          import platform
          import subprocess
          
          CANDIDATE = "b69f8c2c744a376030da946189fd624861e450cf"
          SOURCE_SHA256 = "998ab27a2708bb92d9737f3d528e4a2af0e7b6d1edda4024f7e7b2cfad3f50b5"
          SOURCE = Path("crates/nac-process/src/native_pty/platform/linux.rs")
          POSITIVE = "native_pty::platform::linux::tests::proc_esrch_requires_conclusive_original_capability_death"
          BOOKEND = """    let row = match read_row() {
                  Ok(row) => row,
                  Err(error) if error.raw_os_error() == Some(libc::ESRCH) => {
                      return match probe_original() {
                          Err(death) if death.raw_os_error() == Some(libc::ESRCH) => Ok(false),
                          Err(probe_error) => Err(probe_error),
                          Ok(()) => Err(error),
                      };
                  }
                  Err(error) => return Err(error),
              };"""
          
          
          def command(args):
              return subprocess.check_output(args, text=True).strip()
          
          
          def run(label, args, expected=0):
              print(f"BEGIN {label}: {args!r}", flush=True)
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=300, check=False)
              print(result.stdout, flush=True)
              print(f"END {label}: exit={result.returncode}", flush=True)
              assert result.returncode == expected, (label, result.returncode, expected)
              return result.stdout
          
          
          assert platform.system() == "Linux", platform.platform()
          assert os.environ["CARGO_INCREMENTAL"] == "0"
          assert os.environ["CARGO_BUILD_JOBS"] == "2"
          assert command(["git", "rev-parse", "HEAD^"]) == CANDIDATE
          assert command(["git", "rev-parse", "HEAD"]) == os.environ["GITHUB_SHA"]
          original = SOURCE.read_bytes()
          assert hashlib.sha256(original).hexdigest() == SOURCE_SHA256
          assert original == subprocess.check_output(["git", "show", f"{CANDIDATE}:{SOURCE}"])
          print(f"Linux={platform.platform()} candidate={CANDIDATE} source={SOURCE_SHA256}", flush=True)
          owner = run("owner-green", ["cargo", "test", "--locked", "-p", "nac-process",
                              "native_pty::platform::linux::tests", "--", "--nocapture"])
          assert "10 passed; 0 failed; 0 ignored" in owner
          run("process-green", ["make", "crate-test", "CRATE=nac-process"])
          
          text = original.decode()
          assert text.count(BOOKEND) == 1
          # This is the original behavior under the same private seam and identical tests:
          # a successful original probe followed by read_row()? propagates proc ESRCH.
          baseline = text.replace(BOOKEND, "    let row = read_row()?;")
          args = ["cargo", "test", "--locked", "-p", "nac-process", POSITIVE,
                  "--", "--exact", "--nocapture"]
          try:
              SOURCE.write_text(baseline)
              red = run("pre-bookend-red", args, expected=101)
              assert "running 1 test" in red
              assert f"test {POSITIVE} ... FAILED" in red
              assert "0 passed; 1 failed; 0 ignored" in red
              assert "called `Result::unwrap()` on an `Err` value" in red
              assert 'code: 3, kind: Uncategorized, message: "No such process"' in red
              assert "could not compile" not in red
          finally:
              SOURCE.write_bytes(original)
          assert hashlib.sha256(SOURCE.read_bytes()).hexdigest() == SOURCE_SHA256
          green = run("restored-positive-green", args)
          assert "1 passed; 0 failed; 0 ignored" in green
          assert not command(["git", "status", "--porcelain"])
          print("QUALIFIED: exact Linux owner/full process GREEN; compiled pre-bookend ESRCH RED; restored positive GREEN", flush=True)
          PYCONTROL

name: PRIVATE NEVERMERGE hosted post648 package
run-name: PRIVATE NEVERMERGE hosted package only

on:
  workflow_dispatch:
    inputs:
      package_admission:
        description: Root named one-attempt source-bound original clock admission
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/experimental-native-q-host-package-post648' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
      ROOT_PACKAGE_ADMISSION: ${{ inputs.package_admission }}
    steps:
      - name: Admit original queue-inclusive clock before checkout or bootstrap
        id: initial
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, math, os, pathlib, re, time
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ff8-host-package-gate'
          folder.mkdir(mode=0o700)
          report = dict(status='FAIL', product_build=False, actual_image=os.environ.get('ImageVersion'),
                        expected_image='20261102.0473.1')
          try:
              assert report['actual_image'] == report['expected_image'], 'unexpected/unknown hosted image; no checkout/bootstrap'
              a = json.loads(os.environ['ROOT_PACKAGE_ADMISSION'])
              assert set(a) == {'scope','controller_sha','allocation_id','attempt','retries','clock'}
              assert a['scope'] == 'ff8-hosted-normal-package-only' and a['controller_sha'] == os.environ['GITHUB_SHA']
              assert re.fullmatch('[0-9a-f]{40}', a['controller_sha'])
              assert re.fullmatch('[A-Za-z0-9_-]{1,100}', a['allocation_id'])
              assert type(a['attempt']) is int and a['attempt'] == 1 and type(a['retries']) is int and a['retries'] == 0
              c = a['clock']; keys = ('STARTED','WORK_DEADLINE','CLEANUP_DEADLINE','HARD_DEADLINE')
              assert set(c) == set(keys) and all(type(c[k]) in (int,float) for k in keys)
              start, work, cleanup, hard = [c[k] for k in keys]; now = time.time()
              assert all(math.isfinite(x) for x in (start,work,cleanup,hard,now))
              assert start <= now < work < cleanup < hard and hard-start <= 2400 and work-start <= 1800
              assert cleanup-work >= 480 and hard-cleanup >= 120
              minutes = min(3, math.floor((work-now-60)/60)); assert minutes >= 1
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('minutes='+str(minutes)+'\n')
              report.update(status='PASS', admission=a, minutes=minutes)
          finally:
              (folder/'initial.json').write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.initial.outputs.minutes) }}
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Bind fixed package and maintained helper sources
        id: pair
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0,'controller/.github/scripts/native-q-host-package')
          import importlib.util, pathlib
          f=pathlib.Path('controller/.github/scripts/native-q-host-package/host-package.py')
          spec=importlib.util.spec_from_file_location('route',f); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          m.admit(json.loads(os.environ['ROOT_PACKAGE_ADMISSION']),os.environ)
          p=json.loads(f.with_name('pair.json').read_text())
          assert p['P']=='6c578a2c18050e218b83daf80f46731040e4b3e4'
          assert p['H_tools']=='9863b7714c32ed77bd66867973de6d5b02a753f8'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('P='+p['P']+'\nH='+p['H_tools']+'\n')
          PYCODE
      - name: Bound Rust bootstrap
        id: rust
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native-q-host-package/host-package.py --bootstrap-budget rust
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        timeout-minutes: ${{ fromJSON(steps.rust.outputs.minutes) }}
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin
      - name: Bound Node bootstrap
        id: node
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native-q-host-package/host-package.py --bootstrap-budget node
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.node.outputs.minutes) }}
        with:
          node-version: 24.22.1
      - name: Bound H tools checkout
        id: h
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native-q-host-package/host-package.py --bootstrap-budget checkout-H
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.h.outputs.minutes) }}
        with:
          ref: ${{ steps.pair.outputs.H }}
          path: source-H
          persist-credentials: false
      - name: Bound exact P checkout
        id: p
        timeout-minutes: 1
        run: python3 -B controller/.github/scripts/native-q-host-package/host-package.py --bootstrap-budget checkout-P
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: ${{ fromJSON(steps.p.outputs.minutes) }}
        with:
          ref: ${{ steps.pair.outputs.P }}
          path: source-P
          persist-credentials: false
      - name: One normal package and strict current Q package admission only
        env:
          H_ROOT: ${{ github.workspace }}/source-H
          P_ROOT: ${{ github.workspace }}/source-P
          OUTPUT_ROOT: ${{ runner.temp }}/ff8-host-package-output
        run: python3 -B controller/.github/scripts/native-q-host-package/host-package.py
      - name: Bound always-retention to original hard deadline
        id: retention
        if: always()
        timeout-minutes: 1
        run: |
          python3 -B - <<'PYCODE'
          import json, math, os, time
          minutes=0
          try:
              a=json.loads(os.environ['ROOT_PACKAGE_ADMISSION']); c=a['clock']
              start,work,cleanup,hard=[c[k] for k in ('STARTED','WORK_DEADLINE','CLEANUP_DEADLINE','HARD_DEADLINE')]
              assert all(type(x) in (int,float) and math.isfinite(x) for x in (start,work,cleanup,hard))
              assert start<work<cleanup<hard and hard-start<=2400 and work-start<=1800
              assert cleanup-work>=480 and hard-cleanup>=120
              minutes=max(0,min(2,math.floor((hard-time.time()-15)/60)))
          except (ValueError,KeyError,TypeError,AssertionError): pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('minutes='+str(minutes)+'\n')
          PYCODE
      - name: Retain only original manifest ZIP and bounded receipts
        if: always() && steps.retention.outputs.minutes != '' && steps.retention.outputs.minutes != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: ${{ fromJSON(steps.retention.outputs.minutes) }}
        with:
          name: ff8-host-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ff8-host-package-output/handoff
            ${{ runner.temp }}/ff8-host-package-gate
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

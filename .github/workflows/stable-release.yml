name: Private Darwin readiness diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  darwin-readiness:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Bind actual hosted ARM runner
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          uname -a
          sw_vers
          printf 'ImageOS=%s ImageVersion=%s RUNNER_ARCH=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: nac-ci-v1
          shared-key: native-regressions
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Prepare canonical locked dependencies
        run: make setup
      - name: Build once and record ten finite native episodes
        run: |
          python3 - --expected-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/darwin-readiness-diagnostic" <<'PYDIAGNOSTIC'
          #!/usr/bin/env python3
          """Private finite Darwin diagnostic. Execution requires separate Root admission."""
          import argparse
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import subprocess
          import time

          BASE = "4368844dbeca3f5c08ae345b86e730995166000a"
          SOURCE = "crates/nac-process/src/native_pty/platform_tests.rs"
          SOURCE_SHA256 = "8cf3ae16021acf688e04a93b5ddc41cf11348b872b86052efb97ed8dc278144f"
          ORIGINAL_IMAGE = "20261026.0455.2"
          OWNER_BLOBS = {
              "crates/nac-process/src/native_pty/platform/macos.rs": "ba7f900a2ce229ebc5fb59618ebee8d11ff0dc40",
              SOURCE: "1b93e808de3dd31f9550181bf26086d4f85a2db7",
              "crates/nac-process/src/native_pty/platform/macos_tests.rs": "748c99de636f5f2c192d617dd2ff716d952916e8",
              "crates/nac-process/src/native_pty/platform/macos/inspection.rs": "784049dc396bcf91fbcfb12ce078a0cc8ea533a8",
              "crates/nac-process/src/native_pty/platform/macos/signal_diagnostics.rs": "69b07344a75818e4dc6517ad4b5ffeb047b7e05c",
              "crates/nac-process/src/native_pty/platform.rs": "6aeb3696ee7476f65ed98131f273abd3b0510880",
              "crates/nac-process/AGENTS.md": "3a22afcf4fa85463abe7bca547cd4a664df9381a",
          }
          STRESS = "native_pty::platform::tests::active_census_releases_dead_capabilities_after_child_discovery"
          HELPER = "native_pty::platform::tests::readiness_diagnostic_child"
          CONTROLS = [
              "audit_signal_rejects_wrong_version_without_signaling_fixture",
              "mismatched_unique_identity_cannot_signal_fixture",
              "atomic_signal_permission_failure_retains_exact_live_identity",
              "exec_refresh_keeps_unique_identity_and_uses_new_version",
          ]


          def selected_result(name, output, code):
              """Bind real libtest selection and final summary, including nested isolation."""
              if "running 0 tests" in output or "running 1 test" not in output:
                  return False
              if f"test {name} ..." not in output or "could not compile" in output:
                  return False
              summaries = re.findall(r"^test result: (.+)$", output, re.MULTILINE)
              if not summaries:
                  return False
              if code == 0:
                  return summaries[-1].startswith("ok. 1 passed; 0 failed; 0 ignored;")
              if code != 101 or not summaries[-1].startswith("FAILED. 0 passed; 1 failed; 0 ignored;"):
                  return False
              sections = output.rsplit("\nfailures:\n", 1)
              if len(sections) != 2:
                  return False
              names = sections[1].split("\ntest result:", 1)[0].splitlines()
              return [line for line in names if line] == [f"    {name}"]


          def case_expectation(label, name, output, code, negative):
              selected = selected_result(name, output, code)
              marker_lines = [line for line in output.splitlines() if "NAC_PROCESS_READY_DIAGNOSTIC wait=" in line]
              rows = [re.fullmatch(r"NAC_PROCESS_READY_DIAGNOSTIC wait=(true|false) iteration=(\d+) pid=(\d+)", line)
                      for line in marker_lines]
              markers = len(rows)
              acceptable = code == 0
              if negative is not None:
                  acceptable = code == 101 and negative in output and "NAC_PROCESS_SIGNAL_DIAGNOSTIC" not in output
              if label in ("pid-only", "ready") and code == 0:
                  expected_wait = "true" if label == "ready" else "false"
                  acceptable = acceptable and markers == 48 and all(
                      row is not None and row[1] == expected_wait and int(row[2]) == i and int(row[3]) > 0
                      for i, row in enumerate(rows))
              return selected, bool(acceptable), markers


          def clean_environment(values):
              return {k: v for k, v in values.items()
                      if not k.startswith("NAC_PROCESS_READY_") and k != "NAC_PROCESS_TEST_FD_STRESS_CHILD"}


          def emit(label, raw):
              print(f"BEGIN_RAW {label}", flush=True)
              print(raw, end="" if raw.endswith("\n") else "\n", flush=True)
              print(f"END_RAW {label}", flush=True)


          def read(args):
              return subprocess.check_output(args, text=True, timeout=30).strip()


          p = argparse.ArgumentParser()
          p.add_argument("--expected-sha", required=True)
          p.add_argument("--output", type=pathlib.Path, required=True)
          a = p.parse_args()
          assert platform.system() == "Darwin" and platform.machine() == "arm64"
          assert os.environ.get("GITHUB_ACTIONS") == "true", "actual hosted native CI required"
          assert os.environ.get("CARGO_BUILD_JOBS") == "2" and os.environ.get("CARGO_INCREMENTAL") == "0"
          assert read(["git", "rev-parse", "HEAD"]) == a.expected_sha == os.environ["GITHUB_SHA"]
          assert read(["git", "rev-parse", "HEAD^"]) == BASE
          assert read(["git", "diff", "--name-only", BASE, "HEAD"]).splitlines() == [
              ".github/workflows/stable-release.yml", SOURCE]
          assert not read(["git", "status", "--porcelain"])
          assert hashlib.sha256(pathlib.Path(SOURCE).read_bytes()).hexdigest() == SOURCE_SHA256
          for owner, blob in OWNER_BLOBS.items():
              assert read(["git", "rev-parse", f"{BASE}:{owner}"]) == blob
              if owner != SOURCE:
                  assert read(["git", "rev-parse", f"HEAD:{owner}"]) == blob
          a.output.mkdir(parents=True, exist_ok=False)
          env = clean_environment(os.environ)
          report = {
              "actual_sha": a.expected_sha, "base": BASE, "source_sha256": SOURCE_SHA256,
              "source_blob": read(["git", "rev-parse", f"HEAD:{SOURCE}"]),
              "tree": read(["git", "rev-parse", "HEAD^{tree}"]),
              "workflow_sha256": hashlib.sha256(pathlib.Path(".github/workflows/stable-release.yml").read_bytes()).hexdigest(),
              "cargo_lock_sha256": hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest(),
              "os": read(["sw_vers"]), "kernel": read(["uname", "-a"]),
              "rust": read(["rustc", "-Vv"]), "cargo": read(["cargo", "-V"]),
              "ci": {k: os.environ.get(k) for k in ["GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
                    "GITHUB_SHA", "GITHUB_WORKFLOW", "GITHUB_REPOSITORY", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion"]},
              "original_failure": {"run": 42067358355, "job": 127386277504,
                                   "tested_merge": "55c0e6a4670be1fc9f0cc304da7ed49ee2e5d90e", "image": ORIGINAL_IMAGE,
                                   "os_version": "26.6.2", "os_build": "25G83", "installed_kernel_source_match": "unproven"},
              "original_owner_blobs": OWNER_BLOBS,
              "image_matches_original": os.environ.get("ImageVersion") == ORIGINAL_IMAGE,
              "original_failure_resolved": False, "causal_proof": False, "expected_episode_count": 10, "episodes": [],
          }


          def save():
              raw = json.dumps(report, indent=2) + "\n"
              (a.output / "report.json").write_text(raw)
              emit("report", raw)


          save()
          build = subprocess.run(["cargo", "test", "--locked", "-p", "nac-process", "--lib",
                                  "--no-run", "--message-format=json"], env=env, text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
          for label, raw in [("build.jsonl", build.stdout), ("build.stderr", build.stderr)]:
              (a.output / label).write_text(raw)
              emit(label, raw)
          report["build_returncode"] = build.returncode
          save()
          assert build.returncode == 0, "build failed; no runtime evidence"
          artifacts = [json.loads(line) for line in build.stdout.splitlines() if line.startswith("{")]
          binaries = {x["executable"] for x in artifacts if x.get("reason") == "compiler-artifact"
                      and x.get("profile", {}).get("test") and x.get("executable")
                      and x.get("target", {}).get("name") == "nac_process"}
          assert len(binaries) == 1, "ambiguous exact test artifact"
          binary = binaries.pop()
          report["binary"] = binary
          report["binary_sha256"] = hashlib.sha256(pathlib.Path(binary).read_bytes()).hexdigest()
          listed = subprocess.check_output([binary, "--list"], env=env, text=True)
          (a.output / "list.log").write_text(listed)
          emit("list", listed)
          names = [HELPER, STRESS] + ["native_pty::platform::macos::tests::" + n for n in CONTROLS]
          assert all(n + ": test" in listed.splitlines() for n in names), "exact selection absent"
          cases = [("helper-disabled", HELPER, {}, None)]
          cases += [("control-" + n, "native_pty::platform::macos::tests::" + n, {}, None) for n in CONTROLS]
          cases += [
              ("original-baseline", STRESS, {}, None),
              ("pid-only", STRESS, {"NAC_PROCESS_READY_DIAGNOSTIC": "pid-only"}, None),
              ("ready", STRESS, {"NAC_PROCESS_READY_DIAGNOSTIC": "ready"}, None),
              ("missing-ready", STRESS, {"NAC_PROCESS_READY_DIAGNOSTIC": "ready", "NAC_PROCESS_READY_SUPPRESS": "1"}, "post-exec readiness read:"),
              ("wrong-ready-pid", STRESS, {"NAC_PROCESS_READY_DIAGNOSTIC": "ready", "NAC_PROCESS_READY_WRONG_PID": "1"}, "readiness PID mismatch"),
          ]
          assert len(cases) == 10
          valid = True
          for label, name, extra, negative in cases:
              assert hashlib.sha256(pathlib.Path(binary).read_bytes()).hexdigest() == report["binary_sha256"]
              identity = {"label": label, "name": name, "env": extra, "candidate": a.expected_sha,
                          "binary_sha256": report["binary_sha256"], "ci": report["ci"]}
              print("BEGIN_CASE " + json.dumps(identity, sort_keys=True), flush=True)
              started = time.monotonic()
              result = subprocess.run([binary, "--exact", name, "--test-threads=1", "--nocapture"],
                                      env={**env, **extra}, text=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, check=False)
              (a.output / (label + ".log")).write_text(result.stdout)
              emit(label, result.stdout)
              selected, acceptable, markers = case_expectation(label, name, result.stdout, result.returncode, negative)
              episode = {**identity, "returncode": result.returncode, "seconds": round(time.monotonic() - started, 3),
                         "selected": selected, "control_expectation_met": acceptable, "diagnostic_iterations": markers,
                         "raw_output_sha256": hashlib.sha256(result.stdout.encode()).hexdigest()}
              report["episodes"].append(episode)
              print("END_CASE " + json.dumps(episode, sort_keys=True), flush=True)
              save()
              valid = valid and selected and acceptable
              if not selected or (negative is not None or label.startswith("control-") or label == "helper-disabled") and not acceptable:
                  report["stop_reason"] = "selection or prerequisite/negative control failed; remaining cases UNRUN"
                  break
          report["complete"] = len(report["episodes"]) == len(cases)
          report["diagnostic_controls_and_episodes_met"] = bool(valid and report["complete"])
          report["source_clean_after"] = not read(["git", "status", "--porcelain"])
          save()
          assert report["source_clean_after"], "source drift after diagnostic"
          # Failure is retained even if another comparison arm passes; no rerun or repair.
          raise SystemExit(0 if report["diagnostic_controls_and_episodes_met"] else 1)
          PYDIAGNOSTIC
      - name: Retain raw diagnostic evidence in addition to job stdout
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-readiness-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darwin-readiness-diagnostic
          if-no-files-found: error
          retention-days: 14

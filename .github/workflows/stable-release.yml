name: Stable release

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.stable.outputs.run || steps.ci.outputs.run }}
      sha: ${{ steps.stable.outputs.sha || steps.ci.outputs.sha }}
      version: ${{ steps.stable.outputs.version || steps.ci.outputs.version }}
      tag: ${{ steps.stable.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate stable release target
        id: stable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin dev:refs/remotes/origin/dev
          source_sha="$(git rev-parse HEAD)"
          SOURCE_SHA="$source_sha" DEV_REF=refs/remotes/origin/dev node .github/scripts/release-policy.mjs validate-stable
          {
            echo "run=true"
            echo "sha=$source_sha"
            echo "version=$(tr -d '[:space:]' < version.txt)"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Capture CI source identity
        id: ci
        if: >-
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          {
            echo "run=true"
            echo "sha=$SOURCE_SHA"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  lint:
    if: ${{ needs.prepare.outputs.run == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nac-server/web/package-lock.json

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Lint frontend and backend
        run: make lint

      - name: Check frontend and backend formatting
        run: make format-check

  test-server:
    if: ${{ needs.prepare.outputs.run == 'true' }}
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nac-server/web/package-lock.json

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Run frontend tests
        working-directory: crates/nac-server/web
        run: npm test

      - name: Typecheck the web app
        working-directory: crates/nac-server/web
        run: npm run typecheck

      # The build output is committed so that building nac-web never needs Node.
      # Rebuilding it here catches a commit that changed `web/` without shipping
      # the matching bundle.
      - name: Check the committed frontend build is current
        working-directory: crates/nac-server/web
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../assets/dist)" ]; then
            echo "::error::crates/nac-server/assets/dist is stale; run 'npm --prefix crates/nac-server/web run build' and commit the result"
            git status --porcelain -- ../assets/dist
            exit 1
          fi

      - name: Run nac-server tests
        run: cargo test -p nac-server --locked

      - name: Exercise stable binary readiness and status identity
        run: make test-stable-binary

      - name: Install Playwright Chromium
        working-directory: crates/nac-server/web
        run: npx playwright install --with-deps chromium

      - name: Run production-embedded browser tests
        env:
          NAC_E2E_ARTIFACTS: ${{ github.workspace }}/crates/nac-server/web/test-results
        run: make test-e2e

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nac-web-playwright
          path: crates/nac-server/web/test-results
          if-no-files-found: ignore

  test-core:
    if: ${{ needs.prepare.outputs.run == 'true' }}
    needs: [prepare, lint]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install pinned release-policy dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Run nac-core and nac-catalog-gen tests
        run: cargo test -p nac-core -p nac-catalog-gen --locked

      - name: Test stable release policy and configuration
        run: |
          sh -n .github/scripts/stable-release-rollout.sh
          node --test .github/scripts/release-policy.test.mjs

      - name: Test stable installer routing
        run: |
          sh -n scripts/install.sh
          sh .github/scripts/install.test.sh

  test:
    if: ${{ always() && needs.prepare.outputs.run == 'true' }}
    needs: [prepare, test-server, test-core]
    runs-on: ubuntu-latest

    steps:
      - name: Require all test suites
        env:
          SERVER_RESULT: ${{ needs.test-server.result }}
          CORE_RESULT: ${{ needs.test-core.result }}
        run: |
          test "$SERVER_RESULT" = success
          test "$CORE_RESULT" = success

  build:
    if: ${{ needs.prepare.outputs.run == 'true' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build nac-web binary
        env:
          NAC_BUILD_TRACK: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'stable' || 'dev' }}
          NAC_BUILD_ID: ${{ needs.prepare.outputs.tag || format('dev-{0}', needs.prepare.outputs.sha) }}
          NAC_SOURCE_REVISION: ${{ needs.prepare.outputs.sha }}
        run: |
          cargo build --release --locked \
            -p nac-server --bin nac-web \
            --target ${{ matrix.target }}

      - name: Package and verify archive
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/nac-web" dist/pkg/nac-web
          cp LICENSE dist/pkg/LICENSE
          tar -czf "dist/nac-${{ matrix.target }}.tar.gz" \
            -C dist/pkg nac-web LICENSE

          short_revision="$(git rev-parse --short=12 "$SOURCE_SHA")"
          test "$(dist/pkg/nac-web -V)" = "nac-web $RELEASE_VERSION"
          test "$(dist/pkg/nac-web --version)" = "nac-web $RELEASE_VERSION ($short_revision)"
          test "$(tar -tzf "dist/nac-${{ matrix.target }}.tar.gz" | sort)" = "$(printf 'LICENSE\nnac-web')"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nac-${{ matrix.target }}
          path: dist/nac-${{ matrix.target }}.tar.gz

  publish:
    if: >-
      needs.prepare.outputs.run == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nac-*
          merge-multiple: true

      - name: Upload stable release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

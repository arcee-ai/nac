name: Private ALL425 native Start reply-loss sensitivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-start-reply-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: nac-ci-v1
          shared-key: test-core-test-core
          key: test-core
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Prepare locked dependencies
        run: make setup
      - name: Verify compiled flag-only oracle RED and exact-restored GREEN
        run: |
          python3 - <<'PYCONTROL'
          """One-shot ALL-425 oracle sensitivity on Linux; not a shipping repository file."""
          import hashlib
          import os
          from pathlib import Path
          import platform
          import subprocess
          
          CANDIDATE = "2f4af3f91ae8cbd261c1d65aae9be06c4577db5e"
          SOURCE = Path("crates/nac-core/src/session_service/peer_goals_tests.rs")
          SOURCE_SHA256 = "9787decb07f2bdb94f5bb7b3dd191ec84f9d977bf16300d1f9cb5f2ac5987ccf"
          SELECTOR = "session_service::peer_goals::tests::peer_goals_native_first_start_reply_loss_replays_one_admission_headlessly"
          FLAG = "lose_once: AtomicBool::new(true), // RED control changes ONLY this to false."
          
          
          def command(args):
              return subprocess.check_output(args, text=True, timeout=30).strip()
          
          
          def test(label, selector, expected):
              args = ["cargo", "test", "--locked", "-p", "nac-core", "--lib", selector,
                      "--", "--exact", "--nocapture", "--test-threads=1"]
              print(f"BEGIN {label}: {args!r}", flush=True)
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                      text=True, timeout=900, check=False)
              print(result.stdout, flush=True)
              print(f"END {label}: exit={result.returncode}", flush=True)
              assert result.returncode == expected, (label, result.returncode, expected)
              return result.stdout
          
          
          def require_oracle_red(output):
              assert "running 1 test" in output
              assert f"test {SELECTOR} ..." in output
              assert "test result: FAILED. 0 passed; 1 failed; 0 ignored;" in output
              assert "RED control: first native caller already observed success" in output
              assert "could not compile" not in output
              sections = output.rsplit("\nfailures:\n", 1)
              assert len(sections) == 2
              final = sections[1].split("\ntest result:", 1)
              assert len(final) == 2
              names = [line for line in final[0].splitlines() if line]
              assert names == [f"    {SELECTOR}"]
          
          
          assert platform.system() == "Linux", platform.platform()
          assert os.environ["CARGO_BUILD_JOBS"] == "2" and os.environ["CARGO_INCREMENTAL"] == "0"
          assert command(["git", "rev-parse", "HEAD^"]) == CANDIDATE
          assert command(["git", "rev-parse", "HEAD"]) == os.environ["GITHUB_SHA"]
          assert command(["git", "diff", "--name-only", CANDIDATE, "HEAD"]) == ".github/workflows/stable-release.yml"
          original = SOURCE.read_bytes()
          assert hashlib.sha256(original).hexdigest() == SOURCE_SHA256
          assert original == subprocess.check_output(["git", "show", f"{CANDIDATE}:{SOURCE}"])
          text = original.decode()
          assert text.count(FLAG) == 1
          print(f"Linux={platform.platform()} candidate={CANDIDATE} source={SOURCE_SHA256}", flush=True)
          try:
              SOURCE.write_text(text.replace(FLAG, FLAG.replace("true", "false")))
              red = test("flag-only-oracle-RED", SELECTOR, 101)
              require_oracle_red(red)
          finally:
              SOURCE.write_bytes(original)
          assert hashlib.sha256(SOURCE.read_bytes()).hexdigest() == SOURCE_SHA256
          green = test("exact-restored-GREEN", SELECTOR, 0)
          assert "1 passed; 0 failed; 0 ignored" in green
          assert not command(["git", "status", "--porcelain"])
          print("QUALIFIED: compiled flag-only oracle RED; exact restored GREEN; clean candidate source", flush=True)
          print("Boundary: controller reply loss after durable Start; not internal store ACK, idle successor or model execution", flush=True)
          PYCONTROL

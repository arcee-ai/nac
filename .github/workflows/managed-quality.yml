name: Managed NAC quality

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable candidate from the caller's preparation job
        required: true
        type: string
      quality_receipt:
        description: Exact-candidate complete successful quality results from the same caller run
        default: ''
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          components: rustfmt, clippy
      - name: Install Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Cache managed fault and standalone quality compilation
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: nac-ci-v1
          key: managed-quality
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
      - name: Select verified reuse or full quality for this attempt
        id: quality-mode
        env:
          QUALITY_RECEIPT: ${{ inputs.quality_receipt }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: node .github/scripts/pr-checks.mjs quality-mode >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        if: steps.quality-mode.outputs.mode == 'full'
        run: |
          npm --prefix crates/nac-server/web ci
          npm --prefix .github/scripts ci
      - name: Run the repository acceptance gates
        if: steps.quality-mode.outputs.mode == 'full'
        run: make ci

      - name: Verify the private managed fault fixture
        run: make test-managed-fault-fixture


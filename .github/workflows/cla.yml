name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: "Generate CLA signatures token"
        id: cla-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CLA_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: arcee-ai
          repositories: cla-signatures
          permission-contents: write

      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.cla-token.outputs.token }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/arcee-ai/mergekit/blob/main/CLA.md'
          remote-organization-name: 'arcee-ai'
          remote-repository-name: 'cla-signatures'
          branch: 'signatures'
          allowlist: 'dependabot[bot]'

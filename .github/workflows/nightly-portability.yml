# PRIVATE branch override only. NEVER LAND. Original default nightly remains intact.
name: DIAG terminal observer numeric phases
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact private committed source SHA (no reruns)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: diag-terminal-observer-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  profile:
    name: DIAG one unchanged noisy terminal case
    if: ${{ github.ref == 'refs/heads/codex/all-582-terminal-profile-current-20261106' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: DIAG anchor first-step absolute budget
        run: |
          set -euo pipefail
          echo "PROFILE_JOB_ANCHOR=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable private manual source before tool/cache setup
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = arcee-ai/nac
          test "$GITHUB_REPOSITORY_ID" = 1194218201
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # Rust1.98
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: nac-ci-v1
          shared-key: server-browser-linux-gnu-debug0-v1
          save-if: 'false'
      - name: DIAG bounded fresh native build and one original case
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          exec python3 .github/scripts/terminal-observer-profile.py --source "$EXPECTED_SOURCE"
      - name: DIAG retain numeric phases and exact first outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diag-terminal-observer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-observer-profile/evidence
          if-no-files-found: warn
          retention-days: 7

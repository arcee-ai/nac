name: Private APT transport diagnostic

on:
  push:
    branches: [codex/all-582-apt-transport-probe]

permissions:
  contents: read

jobs:
  paired-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare exact signed font archives in AB/BA order
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_REF: refs/heads/codex/all-582-apt-transport-probe
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_EVENT_NAME" = push
          python3 .github/scripts/apt-transport-native.py \
            --source "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/apt-transport-evidence"
      - name: Retain diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apt-transport-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apt-transport-evidence/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

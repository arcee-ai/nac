name: Native macOS regressions

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: ARM macOS process and credentials
    runs-on: macos-26
    timeout-minutes: 25
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Bind actual native runner and candidate
        env:
          EXPECTED_SHA: ${{ inputs.source-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache focused native tests
        id: cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: native-regressions
      - name: Run exact native regressions and safe Darwin failure control
        env:
          NATIVE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: >-
          python3 .github/scripts/native-regressions.py
          --require-macos-arm --seed-macos
          --output "$RUNNER_TEMP/native-regressions"
      - name: Retain architecture, toolchain, timings and regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-${{ inputs.source-sha }}
          path: ${{ runner.temp }}/native-regressions
          if-no-files-found: error

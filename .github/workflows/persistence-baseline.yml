name: Persistence baseline artifacts

on:
  pull_request:
    paths:
      - .github/workflows/persistence-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NAC_SOURCE_REVISION: c7d4847312650de91cee410185b85d207881b594
      NAC_BUILD_ID: all116-baseline-c7d4847312650de91cee410185b85d207881b594
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7d4847312650de91cee410185b85d207881b594
          persist-credentials: false
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Set up the untouched locked baseline
        run: make setup
      - name: Build the untouched Linux worker and harness
        run: |
          test "$(git rev-parse HEAD)" = "$NAC_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          cargo build --locked -p nac-server --bin nac-web
          cargo test --locked -p nac-server --lib --no-run --message-format=json > /tmp/harness-build.json
          mkdir -p /tmp/all116-baseline/binaries
          cp target/debug/nac-web /tmp/all116-baseline/binaries/nac-web
          python3 - <<'PY'
          import json, pathlib, shutil
          targets = []
          for line in pathlib.Path('/tmp/harness-build.json').read_text().splitlines():
              value = json.loads(line)
              if value.get('executable') and value.get('target', {}).get('name') == 'nac_server':
                  targets.append(value['executable'])
          assert len(targets) == 1, targets
          shutil.copy2(targets[0], '/tmp/all116-baseline/binaries/nac-server-test')
          PY
      - name: Preserve exact source, metadata, and binary identities
        run: |
          git rev-parse HEAD > /tmp/all116-baseline/revision.txt
          git rev-parse HEAD^{tree} > /tmp/all116-baseline/tree.txt
          printf '%s\n' "$GITHUB_WORKSPACE" > /tmp/all116-baseline/compiled-workspace.txt
          git archive HEAD | gzip > /tmp/all116-baseline/source.tar.gz
          tar -czf /tmp/all116-baseline/git-metadata.tar.gz .git/HEAD .git/shallow .git/objects .git/refs
          rustc --version > /tmp/all116-baseline/toolchain.txt
          sha256sum /tmp/all116-baseline/binaries/* /tmp/all116-baseline/*.tar.gz > /tmp/all116-baseline/SHA256SUMS
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: all116-untouched-c7d4847-linux-baseline
          retention-days: 14
          if-no-files-found: error
          path: /tmp/all116-baseline/

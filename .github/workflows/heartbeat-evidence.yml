name: Finite Linux heartbeat evidence

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      control-sha:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: all480-finite-linux-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CONTROL: ${{ inputs.control-sha }}
      EVIDENCE_MODE: ${{ inputs.mode }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/heartbeat-browsers
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - name: Bind explicit dispatch, branch and immutable control before product setup
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'control/.github/scripts/heartbeat-evidence')
          from contract import BASELINE, HEAD, TREE, validate_request, write_json
          output = Path(os.environ['RUNNER_TEMP'])/'heartbeat-evidence'
          output.mkdir(mode=0o700)
          proof = {'state': 'FAIL_DISPATCH_BINDING', 'runtime_started': False}
          try:
              validate_request(os.environ['EXPECTED_CONTROL'], os.environ['GITHUB_EVENT_NAME'],
                               os.environ['GITHUB_REF'], os.environ['EVIDENCE_MODE'], HEAD, TREE, BASELINE)
              assert os.environ['EXPECTED_CONTROL'] == os.environ['GITHUB_SHA'], 'control revision changed'
              proof.update(state='BOUND', control=os.environ['EXPECTED_CONTROL'], head=HEAD, tree=TREE, baseline=BASELINE)
          finally:
              write_json(output/'dispatch.json', proof)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 48b9769453c7cb0b245d9f9b1f955ef4a880a431
          fetch-depth: 0
          persist-credentials: false
          path: product
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Prepare locked product dependencies before the isolated workload
        working-directory: product
        run: |
          setup_status=0
          make setup > "$RUNNER_TEMP/heartbeat-evidence/setup.stdout" 2> "$RUNNER_TEMP/heartbeat-evidence/setup.stderr" || setup_status=$?
          printf '{"exit":%s}\n' "$setup_status" > "$RUNNER_TEMP/heartbeat-evidence/setup-terminal.json"
          exit "$setup_status"
      - name: Install Chromium system dependencies
        working-directory: product/crates/nac-server/web
        run: |
          chromium_status=0
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/heartbeat-evidence/chromium.stdout" 2> "$RUNNER_TEMP/heartbeat-evidence/chromium.stderr" || chromium_status=$?
          printf '{"exit":%s}\n' "$chromium_status" > "$RUNNER_TEMP/heartbeat-evidence/chromium-terminal.json"
          exit "$chromium_status"
      - name: Compile, capture and measure once in serial under private namespaces
        run: |
          python3 control/.github/scripts/heartbeat-evidence/run.py \
            --product "$GITHUB_WORKSPACE/product" --control "$EXPECTED_CONTROL" \
            --mode "$EVIDENCE_MODE" --output "$RUNNER_TEMP/heartbeat-evidence/run"
      - name: Retain original PNGs, binaries, logs and provenance on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heartbeat-evidence-${{ inputs.control-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heartbeat-evidence
          retention-days: 14
          if-no-files-found: error

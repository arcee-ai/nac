name: Edge Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nac-server/web/package-lock.json

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Lint, test, and typecheck the web app
        working-directory: crates/nac-server/web
        run: |
          npm run lint
          npm test
          npm run typecheck

      # The build output is committed so that building nac-web never needs Node.
      # Rebuilding it here catches a commit that changed `web/` without shipping
      # the matching bundle.
      - name: Check the committed frontend build is current
        working-directory: crates/nac-server/web
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../assets/dist)" ]; then
            echo "::error::crates/nac-server/assets/dist is stale; run 'npm --prefix crates/nac-server/web run build' and commit the result"
            git status --porcelain -- ../assets/dist
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build nac-web binary
        run: |
          cargo build --release --locked \
            -p nac-server --bin nac-web \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/nac-web" dist/pkg/nac-web
          tar -czf "dist/nac-${{ matrix.target }}.tar.gz" \
            -C dist/pkg nac-web

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nac-${{ matrix.target }}
          path: dist/nac-${{ matrix.target }}.tar.gz

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nac-*
          merge-multiple: true

      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if gh release view edge >/dev/null 2>&1; then
            git tag -f edge "$GITHUB_SHA"
            git push origin refs/tags/edge --force
            gh release upload edge dist/* --clobber
          else
            gh release create edge dist/* \
              --title edge \
              --notes "Latest main build of nac." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

name: Edge Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-workspace-crates: true
          key: workspace-v1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check web assets
        run: |
          node --check crates/nac-server/assets/app.js
          node --test crates/nac-server/assets/app.test.js

      - name: Run nac-server tests
        run: cargo test -p nac-server --locked

  test-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-workspace-crates: true
          key: workspace-v1

      - name: Run nac-core tests
        run: cargo test -p nac-core --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-workspace-crates: true
          key: workspace-v1

      - name: Build nac-web binary
        run: |
          cargo build --release --locked \
            -p nac-server --bin nac-web \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/nac-web" dist/pkg/nac-web
          tar -czf "dist/nac-${{ matrix.target }}.tar.gz" \
            -C dist/pkg nac-web

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nac-${{ matrix.target }}
          path: dist/nac-${{ matrix.target }}.tar.gz

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, test-core, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nac-*
          merge-multiple: true

      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --tags origin

          if gh release view edge >/dev/null 2>&1; then
            git tag -f edge "$GITHUB_SHA"
            git push origin refs/tags/edge --force
            gh release upload edge dist/* --clobber
          else
            gh release create edge dist/* \
              --title edge \
              --notes "Latest main build of nac." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload binaries to
        required: false
        type: string

jobs:
  test-server:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/nac-server/web/package-lock.json

      - name: Install web dependencies
        working-directory: crates/nac-server/web
        run: npm ci

      - name: Lint and typecheck the web app
        working-directory: crates/nac-server/web
        run: |
          npm run lint
          npm run typecheck

      # The build output is committed so that building nac-web never needs Node.
      # Rebuilding it here catches a commit that changed `web/` without shipping
      # the matching bundle.
      - name: Check the committed frontend build is current
        working-directory: crates/nac-server/web
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../assets/dist)" ]; then
            echo "::error::crates/nac-server/assets/dist is stale; run 'npm --prefix crates/nac-server/web run build' and commit the result"
            git status --porcelain -- ../assets/dist
            exit 1
          fi

      - name: Run nac-server tests
        run: cargo test -p nac-server --locked

  test-core:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run nac-core and nac-catalog-gen tests
        run: cargo test -p nac-core -p nac-catalog-gen --locked

  test:
    if: ${{ always() }}
    needs: [test-server, test-core]
    runs-on: ubuntu-latest

    steps:
      - name: Require all test suites
        env:
          SERVER_RESULT: ${{ needs.test-server.result }}
          CORE_RESULT: ${{ needs.test-core.result }}
        run: |
          test "$SERVER_RESULT" = success
          test "$CORE_RESULT" = success

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build nac-web binary
        run: |
          cargo build --release --locked \
            -p nac-server --bin nac-web \
            --target ${{ matrix.target }}

      - name: Package archive
        run: |
          mkdir -p dist/pkg
          cp "target/${{ matrix.target }}/release/nac-web" dist/pkg/nac-web
          cp LICENSE dist/pkg/LICENSE
          tar -czf "dist/nac-${{ matrix.target }}.tar.gz" \
            -C dist/pkg nac-web LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nac-${{ matrix.target }}
          path: dist/nac-${{ matrix.target }}.tar.gz

  publish:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nac-*
          merge-multiple: true

      - name: Upload release archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber

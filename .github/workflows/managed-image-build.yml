name: Managed NAC image construction

on:
  workflow_call:
    outputs:
      sha:
        description: Exact candidate built and verified by this invocation
        value: ${{ jobs.prepare.outputs.sha }}
    inputs:
      cold_caches:
        description: Explicit PR/manual cache-miss measurement; acceptance work is unchanged
        type: boolean
        required: false
        default: false
      source_sha:
        description: Immutable candidate from the caller's preparation job
        required: true
        type: string
      policy_mode:
        description: Event-bound policy mode from the caller; standalone runs derive it
        default: ''
        type: string
      trusted_policy_sha:
        description: Ordinary trusted policy pin; publication resolves canonical dev independently
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: managed-image-build-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
      policy_mode: ${{ steps.policy.outputs.mode }}
      policy_sha: ${{ steps.policy.outputs.policy_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - id: candidate
        name: Resolve immutable candidate
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Bind image policy to the eligible caller event
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_POLICY_MODE: ${{ inputs.policy_mode }}
          REQUESTED_POLICY_SHA: ${{ inputs.trusted_policy_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: node scripts/security/image-policy.mjs select "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  contract:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image, entrypoint, smoke, and workflow contracts
        run: |
          sh -n docker/managed/entrypoint.sh
          sh -n scripts/smoke-managed-image.sh
          sh -n scripts/test-managed-image-contract.sh
          sh scripts/test-managed-image-contract.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Test image inventory, trusted-policy and workflow failure contracts
        run: |
          npm --prefix .github/scripts ci --ignore-scripts
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
          node --test scripts/security/image-policy.test.mjs scripts/security/image-workflow.test.mjs scripts/security/image-scanner-workflow.test.mjs scripts/security/image-publication.test.mjs

  scanner-qualification:
    # Live scanner controls do not consume the candidate image. Keep their
    # separate tools/database local to this job; image scanning still runs live.
    needs: [prepare, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Qualify real OS/Node advisory matching and runtime/DB negatives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/security/image_qualify.py --output image-security-fixtures \
            --tool-cache "$RUNNER_TEMP/image-security-tools" --db-cache "$RUNNER_TEMP/image-security-db"
      - name: Retain live qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-image-security-fixtures-${{ needs.prepare.outputs.sha }}
          path: |
            image-security-fixtures/
            !image-security-fixtures/**/root/**
          retention-days: 14
          if-no-files-found: error


  build-candidate:
    # Image construction/smoke is unprivileged; result still requires full fault quality.
    needs: [prepare, contract]
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.image.outputs.id }}
      policy_sha: ${{ steps.publication-policy.outputs.sha || needs.prepare.outputs.policy_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Select supported image build driver
        id: image-driver
        run: python3 .github/scripts/image-build-driver.py >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        id: buildx
        with:
          driver: ${{ steps.image-driver.outputs.driver }}
      - name: Build exact linux/amd64 image without publication
        id: build-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: docker/managed/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          cache-from: ${{ !((github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && inputs.cold_caches == true) && 'type=gha,scope=nac-managed-linux-amd64-v1' || '' }}
          no-cache: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && inputs.cold_caches == true }}
          cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && 'type=gha,mode=max,scope=nac-managed-linux-amd64-v1' || '' }}
          tags: nac-managed-smoke:${{ needs.prepare.outputs.short_sha }}
          build-args: |
            NAC_BUILD_TRACK=dev
            NAC_BUILD_ID=dev-${{ needs.prepare.outputs.sha }}
            NAC_SOURCE_REVISION=${{ needs.prepare.outputs.sha }}
          provenance: false
          sbom: false
      - name: Bind the loaded immutable image identity once
        id: image
        env:
          BUILT_IMAGE_ID: ${{ steps.build-image.outputs.imageid }}
        run: |
          [[ "$BUILT_IMAGE_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_id=$(docker image inspect --format '{{.Id}}' "$BUILT_IMAGE_ID")
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Run credential-independent image smoke
        id: smoke
        env:
          MANAGED_IMAGE: ${{ steps.image.outputs.id }}
          MANAGED_IMAGE_SKIP_BUILD: "1"
        run: sh scripts/smoke-managed-image.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Pin canonical reviewed-dev image policy for publication
        id: publication-policy
        if: needs.prepare.outputs.policy_mode == 'publication'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          REQUESTED_POLICY_SHA: ${{ needs.prepare.outputs.policy_sha }}
        run: |
          node .github/scripts/publication-policy.mjs resolve "$CANDIDATE_SHA" \
            "$GITHUB_WORKSPACE/image-security-evidence/policy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.publication-policy.outputs.sha || needs.prepare.outputs.policy_sha }}
          path: trusted-image-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Inventory the exact tested image
        id: inventory
        if: ${{ !cancelled() && steps.image.outputs.id != '' && steps.smoke.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/security/image_scan.py --image "$IMAGE_ID" --source-revision "$SOURCE_SHA" \
            --trusted-policy trusted-image-policy/.github/security/exceptions.json \
            --candidate-policy .github/security/exceptions.json --output image-security-evidence/inventory --inventory-only --collect-applicability \
            --tool-cache "$RUNNER_TEMP/image-security-tools" --db-cache "$RUNNER_TEMP/image-security-db"
      - name: Freeze the exact inventoried image without publication
        if: steps.inventory.outcome == 'success'
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          docker image save --output image-security-evidence/image.tar "$IMAGE_ID"
          PYTHONPATH=scripts/security python3 -c 'import os; import image_candidate_archive as c; c._check_image_config("image-security-evidence/image.tar", os.environ["IMAGE_ID"])'
      - name: Retain frozen candidate before strict scan
        if: steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-image-candidate-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-security-evidence/image.tar
            image-security-evidence/inventory/
          retention-days: 14
          if-no-files-found: error

  strict-scan:
    needs: [prepare, build-candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Retrieve only the frozen candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: managed-image-candidate-${{ needs.prepare.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-security-evidence
      - name: Load and bind the frozen image in a clean runner
        env:
          IMAGE_ID: ${{ needs.build-candidate.outputs.image_id }}
        run: |
          PYTHONPATH=scripts/security python3 -c 'import os; import image_candidate_archive as c; c.load_exact_image("image-security-evidence/image.tar", os.environ["IMAGE_ID"])'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
      - name: Pin canonical reviewed-dev image policy for publication
        id: publication-policy
        if: needs.prepare.outputs.policy_mode == 'publication'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          REQUESTED_POLICY_SHA: ${{ needs.prepare.outputs.policy_sha }}
        run: |
          node .github/scripts/publication-policy.mjs resolve "$CANDIDATE_SHA" \
            "$GITHUB_WORKSPACE/image-security-evidence/policy" >> "$GITHUB_OUTPUT"
      - name: Reject policy changes between inventory and scan
        env:
          INVENTORY_POLICY_SHA: ${{ needs.build-candidate.outputs.policy_sha }}
          SCAN_POLICY_SHA: ${{ steps.publication-policy.outputs.sha || needs.prepare.outputs.policy_sha }}
        run: |
          [[ "$INVENTORY_POLICY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$INVENTORY_POLICY_SHA" == "$SCAN_POLICY_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.publication-policy.outputs.sha || needs.prepare.outputs.policy_sha }}
          path: trusted-image-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the same tested image with reviewed policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_ID: ${{ needs.build-candidate.outputs.image_id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          POLICY_MODE: ${{ needs.prepare.outputs.policy_mode }}
          NAC_PUBLICATION_POLICY_SHA: ${{ steps.publication-policy.outputs.sha }}
        run: |
          extra=()
          if [[ "$POLICY_MODE" = publication ]]; then
            extra+=(--publication-policy "$GITHUB_WORKSPACE/image-security-evidence/policy/publication-policy.json")
          fi
          scan_status=0
          python3 scripts/security/image_scan.py --bundle image-security-evidence/inventory --image "$IMAGE_ID" --source-revision "$SOURCE_SHA" \
            --trusted-policy trusted-image-policy/.github/security/exceptions.json \
            --candidate-policy .github/security/exceptions.json --output image-security-evidence/security \
            --tool-cache "$RUNNER_TEMP/image-security-tools" --db-cache "$RUNNER_TEMP/image-security-db" "${extra[@]}" || scan_status=$?
          python3 scripts/security/image_ci_report.py --scan-output image-security-evidence/security \
            --scanner-exit "$scan_status" --image "$IMAGE_ID" --source-revision "$SOURCE_SHA"
      - name: Report exact-image security findings
        if: always()
        run: |
          echo '### Image findings are advisory; enforcement is deferred' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI success does not establish image security clearance. Full findings remain below.' >> "$GITHUB_STEP_SUMMARY"
          if test -f image-security-evidence/security/report.md; then
            cat image-security-evidence/security/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Image security incomplete: inspect failed inventory/tool/database/fixture steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain exact-image security evidence even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-image-security-${{ needs.prepare.outputs.sha }}
          path: |
            image-security-evidence/
            !image-security-evidence/image.tar
          retention-days: 14
          if-no-files-found: error

  result:
    name: Managed image checks complete
    if: ${{ always() }}
    needs: [prepare, contract, scanner-qualification, build-candidate, strict-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Reject any missing, skipped, cancelled or failed managed work
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: node .github/scripts/pr-checks.mjs managed-image-aggregate

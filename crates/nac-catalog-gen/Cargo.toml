[package]
name = "nac-catalog-gen"
version.workspace = true
edition.workspace = true
publish = false

# Dev-time tool: generates nac-core's checked-in model catalog baseline from
# models.dev data. Never runs at build time (no build.rs) and is never linked
# into nac binaries; the checked-in output keeps `--locked`/offline builds
# hermetic. All dependencies are already in the workspace tree.
[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
reqwest = { workspace = true, default-features = false, features = ["rustls"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread"] }

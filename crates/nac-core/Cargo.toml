[package]
name = "nac-core"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
name = "nac_core"

[features]
default = []
test-support = []
openapi = ["dep:utoipa"]

[dependencies]
nac-contracts = { path = "../nac-contracts" }
nac-credential-store = { path = "../nac-credential-store" }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true, features = ["json", "form", "rustls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
semver = "1"
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { workspace = true, features = ["serde", "v4"] }
libc.workspace = true
portable-pty = "0.8"
rmcp = { workspace = true, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
toml.workspace = true
toml_edit = "0.22"
url = "2"
serde_yaml_ng = "0.10"
diffy = { version = "0.5.0", default-features = false }
fs2 = "0.4"
sha2.workspace = true
rand = "0.9"
regex = "1"
base64 = "0.22"
cap-std = "4"
globset = { version = "0.4", default-features = false }
grep-matcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
openssh-sftp-client = { version = "0.15", default-features = false }
utoipa = { workspace = true, optional = true, features = ["uuid"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
parking_lot = "0.12"

[package]
name = "nac-core"
version.workspace = true
edition.workspace = true

[lib]
name = "nac_core"

[features]
default = []
test-support = []

[dependencies]
tokio = { workspace = true, default-features = false, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true, default-features = false, features = ["json", "form", "rustls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { workspace = true, features = ["serde", "v4"] }
libc = "0.2"
portable-pty = "0.8"
rmcp = { workspace = true, default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
toml.workspace = true
url = "2"
serde_yaml_ng = "0.10"
diffy = { version = "0.5.0", default-features = false }
fs2 = "0.4"
sha2.workspace = true
rand = "0.9"
base64 = "0.22"
cap-std = "4"
globset = { version = "0.4", default-features = false }
grep-matcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
openssh-sftp-client = { version = "0.15", default-features = false }

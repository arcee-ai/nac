[package]
name = "nac-managed"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
default = []
openapi = ["dep:utoipa", "nac-contracts/openapi"]
test-support = []

[dependencies]
nac-contracts = { path = "../nac-contracts" }
nac-credential-store = { path = "../nac-credential-store" }
nac-process = { path = "../nac-process" }
anyhow.workspace = true
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml.workspace = true
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

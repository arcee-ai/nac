[package]
name = "nac-server"
version = "0.1.3"
edition = "2021"

[lints]
workspace = true

[lib]
name = "nac_server"

[[bin]]
name = "nac-web"
path = "src/main.rs"

[dependencies]
nac-contracts = { path = "../nac-contracts" }
nac-core = { path = "../nac-core", features = ["openapi"] }
nac-managed = { path = "../nac-managed" }
anyhow.workspace = true
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
include_dir = "0.7"
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
uuid = { workspace = true, features = ["v4"] }
utoipa.workspace = true
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }

[dev-dependencies]
flate2 = "1"
nac-core = { path = "../nac-core", features = ["test-support"] }
nac-managed = { path = "../nac-managed", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }

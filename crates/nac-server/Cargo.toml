[package]
name = "nac-server"
version.workspace = true
edition.workspace = true

[lib]
name = "nac_server"

[[bin]]
name = "nac-web"
path = "src/main.rs"

[dependencies]
nac-core.workspace = true
anyhow.workspace = true
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
include_dir = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
rmcp = { workspace = true, default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
flate2 = "1"
nac-core = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "nac-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "nac_server"

[[bin]]
name = "nac-web"
path = "src/main.rs"

[features]
default = ["share-ngrok"]
share-ngrok = ["dep:ngrok", "dep:reqwest", "dep:toml", "dep:toml_edit", "dep:url"]

[dependencies]
nac-core = { path = "../nac-core" }
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
ngrok = { version = "0.19.0", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }
tower-http = { version = "0.6", features = ["cors"] }
url = { version = "2", optional = true }

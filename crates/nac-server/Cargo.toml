[package]
name = "nac-server"
version = "0.1.2"
edition = "2021"

[lib]
name = "nac_server"

[[bin]]
name = "nac-web"
path = "src/main.rs"

[dependencies]
nac-core = { path = "../nac-core", features = ["openapi"] }
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
rmcp = { version = "1.3", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
uuid = { version = "1", features = ["v4"] }
utoipa = "5.5"
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }

[dev-dependencies]
flate2 = "1"
nac-core = { path = "../nac-core", features = ["test-support"] }
libc = "0.2"
tower = { version = "0.5", features = ["util"] }

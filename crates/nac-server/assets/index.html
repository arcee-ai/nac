<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>nac</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/redesign.css?v=composer-alignment" />
  </head>
  <body>
    <div id="app" class="app-frame">
      <section id="sessionPicker" class="picker-surface" aria-labelledby="pickerTitle">
        <header class="picker-bar">
          <div class="brand-lockup">
            <span class="wordmark">NAC</span>
          </div>
          <span id="pickerNavStatus" class="nav-status picker-nav-status" role="status" aria-live="polite" hidden></span>
        </header>
        <p id="reorderInstructions" class="sr-only">Use a session move handle with the arrow, Home, or End keys to reorder it.</p>
        <div id="reorderLive" class="sr-only" aria-live="polite"></div>
        <main class="session-browser">
          <div class="session-list-heading">
            <div class="session-list-title">
              <h1 id="pickerTitle">All sessions</h1>
              <span id="pickerSessionTotal">0</span>
            </div>
            <button id="newSessionBtn" class="picker-new-session icon-button" type="button" aria-label="New session" title="New session">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div id="sessionGrid" class="session-groups" aria-label="Session list"></div>
        </main>
      </section>

      <section id="sessionWorkspace" class="workspace-surface" hidden aria-labelledby="sessionTitle">
        <header class="session-bar">
          <button id="backToSessions" class="icon-button session-grid-button" type="button" aria-label="Back to all sessions" title="All sessions">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
          </button>
          <div class="session-identity">
            <button id="renameSession" class="session-title-button" type="button" title="Rename session"><span id="sessionTitle">Session</span></button>
            <span id="sessionLocation" class="session-location"></span>
          </div>
          <dl class="session-metrics" aria-label="Session metrics">
            <div><dt>Model</dt><dd id="metricModel">—</dd></div>
            <div><dt>Context</dt><dd id="metricContext">—</dd></div>
            <div><dt>Tokens</dt><dd id="metricTokens">—</dd></div>
            <div><dt>Changes</dt><dd id="metricChanges">—</dd></div>
          </dl>
          <span id="sessionNavStatus" class="nav-status session-nav-status" role="status" aria-live="polite" hidden></span>
          <button id="stopRun" class="icon-button danger-button" type="button" aria-label="Stop active run" title="Stop active run" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
          </button>
        </header>

        <div id="sessionLayout" class="session-layout">
          <aside class="overview-rail" aria-label="Session overview">
            <section class="rail-section overview-section">
              <div class="section-heading">
                <h2>Overview</h2>
                <button id="refreshSession" class="overview-refresh" type="button" aria-label="Generate overview" title="Generate overview">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 5v6h-6"></path></svg>
                </button>
              </div>
              <div id="generatedOverview" class="generated-overview is-empty">Not generated.</div>
            </section>
            <section class="rail-section orchestrator-section" aria-labelledby="orchestratorTitle">
              <div class="section-heading">
                <h2 id="orchestratorTitle">Orchestrator</h2>
                <div class="section-actions">
                  <span id="orchestratorState" class="orchestrator-state">Idle</span>
                  <button id="expandOrchestrator" class="expand-button" type="button" aria-label="Open orchestrator conversation" title="Open orchestrator conversation">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg>
                  </button>
                </div>
              </div>
              <ol id="orchestratorLedger" class="action-ledger orchestrator-ledger" aria-live="polite"></ol>
            </section>
          </aside>

          <section id="focusPanel" class="focus-panel" aria-labelledby="focusTitle" hidden>
            <header class="focus-header">
              <div class="focus-identity">
                <h2 id="focusTitle">Detail</h2>
                <span id="focusState" class="focus-state"></span>
              </div>
              <button id="closeFocusPanel" class="expand-button" type="button" aria-label="Close fullscreen view" title="Close fullscreen view">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"></path></svg>
              </button>
            </header>
            <div id="focusContent" class="focus-content" aria-live="polite"></div>
          </section>

          <main class="thread-canvas" aria-label="Threads">
            <div id="threadGrid" class="thread-board" aria-live="polite"></div>
          </main>

          <form id="commandComposer" class="composer">
            <div id="composerTarget" class="composer-target" hidden>
              <span>Thread</span><strong id="composerTargetName"></strong>
              <button id="clearTarget" type="button" aria-label="Clear thread target">×</button>
            </div>
            <textarea id="promptInput" rows="1" spellcheck="false" placeholder="Message the orchestrator · / for commands" aria-label="Message the orchestrator"></textarea>
            <button id="sendPrompt" class="composer-send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"></path></svg>
            </button>
            <div id="commandMenu" class="command-menu" hidden></div>
          </form>
        </div>
      </section>
    </div>

    <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
    <aside id="utilityDrawer" class="utility-drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawerTitle">
      <header class="drawer-header">
        <h2 id="drawerTitle">Details</h2>
        <button id="closeDrawer" class="icon-button" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </header>
      <div id="drawerContent" class="drawer-content"></div>
    </aside>

    <dialog id="launchDialog" class="modal">
      <form id="launchForm" method="dialog" class="modal-form">
        <header class="modal-header"><h2>new session</h2><button class="icon-button" type="button" data-close-dialog="launchDialog" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></header>
        <fieldset id="launchExecutionModes" class="execution-modes">
          <legend>execution</legend>
          <label><input type="radio" name="execution_mode" value="local" checked><span>local</span></label>
          <label><input type="radio" name="execution_mode" value="ssh"><span>ssh</span></label>
          <label><input type="radio" name="execution_mode" value="sandbox"><span>sandbox</span></label>
        </fieldset>
        <div class="field-grid">
          <label class="field span-two"><span>working directory</span><input id="launchCwd" name="cwd" autocomplete="off" placeholder="/path/to/repository"></label>
          <label id="launchSshField" class="field span-two" hidden><span>ssh host</span><input id="launchSshHost" name="ssh_host" autocomplete="off" placeholder="user@host"></label>
          <label class="field"><span>backend</span><select id="launchBackend" name="backend">
            <option value="">from config</option><option value="openai-responses">openai-responses</option><option value="chatgpt-codex-responses">chatgpt-codex-responses</option><option value="anthropic-messages">anthropic-messages</option><option value="deepseek-chat">deepseek-chat</option><option value="fireworks-chat">fireworks-chat</option><option value="together-chat">together-chat</option><option value="arcee-auth">arcee-auth</option><option value="arcee-api">arcee-api</option>
          </select></label>
          <label class="field"><span>reasoning</span><select id="launchEffort" name="reasoning_effort"><option value="">from config</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option><option value="xhigh">xhigh</option></select></label>
          <label class="field"><span>model</span><input id="launchModel" name="model" autocomplete="off" placeholder="from config"></label>
          <label class="field"><span>base url</span><input id="launchBaseUrl" name="base_url" autocomplete="off" placeholder="from config"></label>
          <label class="field"><span>api key environment variable</span><input id="launchApiKeyEnv" name="api_key_env" autocomplete="off" placeholder="from config"></label>
          <label class="field"><span>extra headers</span><input id="launchExtraHeaders" name="extra_headers" autocomplete="off" placeholder='{"X-Header":"value"}'></label>
          <div id="sandboxFields" class="field-grid nested-grid span-two" hidden>
            <label class="field"><span>image</span><input id="sandboxImage" autocomplete="off" placeholder="default image"></label>
            <label class="field"><span>gpu</span><input id="sandboxGpu" autocomplete="off" placeholder="none"></label>
            <label class="field"><span>container working directory</span><input id="sandboxWorkdir" autocomplete="off" placeholder="default"></label>
            <label class="field"><span>shared memory</span><input id="sandboxShm" autocomplete="off" placeholder="e.g. 2g"></label>
            <label class="field span-two"><span>mounts</span><input id="sandboxMounts" autocomplete="off" placeholder="host:container, host:container"></label>
            <label class="checkbox-field span-two"><input id="sandboxNoMount" type="checkbox"><span>do not mount the current working directory</span></label>
          </div>
          <label class="field span-two"><span>initial prompt</span><textarea id="initialPrompt" rows="3" placeholder="optional"></textarea></label>
        </div>
        <footer class="modal-actions"><div id="launchStatus" class="form-status" role="status"></div><button class="button button-primary" type="submit">create session</button></footer>
      </form>
    </dialog>

    <script src="/assets/vendor/markdown-it.min.js" defer></script>
    <script src="/assets/vendor/purify.min.js" defer></script>
    <script src="/assets/app.js?v=orchestrator-steering" defer></script>
  </body>
</html>

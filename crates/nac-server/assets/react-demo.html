<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nac sessions — React + htm PoC</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <style>
      /* PoC-only chrome. Everything else reuses the existing app.css classes. */
      .poc-shell { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; box-sizing: border-box; }
      .poc-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .poc-badge { font: 700 10px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); background: var(--teal); padding: 3px 8px; border-radius: var(--radius-pill); }
      .poc-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .poc-pane { min-width: 0; }
      .poc-events { display: flex; flex-direction: column; gap: 4px; max-height: 60vh; overflow: auto; }
      .poc-event { font: 400 11px var(--mono); color: var(--muted); padding: 4px 6px; border-radius: var(--radius-sm); background: var(--bg-sunken); }
      .poc-event b { color: var(--text); font-weight: 700; }
      /* app.css hides .inspector below 1180px (mobile detail mode); the PoC lays
         it out side-by-side, so keep it visible within our own grid. */
      .poc-layout .inspector { display: grid; }
      @media (max-width: 900px) { .poc-layout { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <div id="reactRoot"></div>

    <script src="/assets/vendor/react.production.min.js"></script>
    <script src="/assets/vendor/react-dom.production.min.js"></script>
    <script src="/assets/vendor/htm.js"></script>
    <script src="/assets/app-react.js"></script>
  </body>
</html>

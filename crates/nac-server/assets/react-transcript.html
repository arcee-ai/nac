<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nac transcript — React + htm PoC</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="/assets/vendor/highlight-github-dark.min.css" />
    <style>
      .poc-shell { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; box-sizing: border-box; max-width: 900px; margin: 0 auto; }
      .poc-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .poc-badge { font: 700 10px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--bg); background: var(--teal); padding: 3px 8px; border-radius: var(--radius-pill); }
      .poc-note { font: 400 11px var(--mono); color: var(--faint); }
      .poc-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .poc-btn { font: 600 12px var(--sans); color: var(--text); background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 6px 12px; cursor: pointer; }
      .poc-btn:hover { border-color: var(--highlight); }
      .poc-btn[disabled] { opacity: 0.5; cursor: default; }
      .poc-select { font: 500 12px var(--sans); color: var(--text); background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 6px 10px; max-width: 340px; }
      .poc-select[disabled] { opacity: 0.5; }
      .poc-source { font: 400 11px var(--mono); color: var(--faint); }
      .poc-source code { color: var(--teal); }
      .poc-error { font: 500 12px var(--mono); color: #dc767e; background: rgba(220,118,126,0.08); border: 1px solid rgba(220,118,126,0.3); border-radius: var(--radius-md); padding: 6px 10px; }
      .stream-caret { display: inline-block; width: 7px; height: 1.05em; vertical-align: text-bottom; background: var(--teal); animation: poc-blink 1s steps(2, start) infinite; margin-left: 1px; }
      @keyframes poc-blink { to { visibility: hidden; } }
      .message-body.markdown pre { overflow: auto; }
    </style>
  </head>
  <body>
    <div id="reactRoot"></div>

    <script src="/assets/vendor/react.production.min.js"></script>
    <script src="/assets/vendor/react-dom.production.min.js"></script>
    <script src="/assets/vendor/htm.js"></script>
    <script src="/assets/vendor/markdown-it.min.js"></script>
    <script src="/assets/vendor/purify.min.js"></script>
    <script src="/assets/vendor/highlight.min.js"></script>
    <script src="/assets/vendor/html-react-parser.min.js"></script>
    <script src="/assets/app-react-transcript.js"></script>
  </body>
</html>

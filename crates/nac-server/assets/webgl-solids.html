<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGL Solids Generator</title>
    <link rel="stylesheet" href="./webgl-solids.css">
    <script defer src="./webgl-solids.js"></script>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <section class="hero-panel" aria-describedby="app-description">
        <div>
          <p class="eyebrow">Standalone WebGL demo</p>
          <h1 id="app-title">Procedural 3D Solids</h1>
          <p id="app-description">
            Generate raw WebGL meshes for common solids without npm, bundlers, or external libraries.
          </p>
        </div>
        <a class="back-link" href="./next.html">Back to nac dashboard</a>
      </section>

      <section class="workbench" aria-label="WebGL solids workbench">
        <aside class="controls" aria-label="Generator controls">
          <label>
            Solid
            <select id="solid-select">
              <option value="cube">Cube</option>
              <option value="sphere" selected>Sphere</option>
              <option value="cylinder">Cylinder</option>
              <option value="cone">Cone</option>
              <option value="torus">Torus</option>
            </select>
          </label>

          <label>
            Detail
            <span class="control-row">
              <input id="detail-input" type="range" min="4" max="64" step="1" value="24">
              <output id="detail-output" for="detail-input">24</output>
            </span>
          </label>

          <label>
            Surface color
            <span class="control-row color-row">
              <input id="color-input" type="color" value="#4fd1ff">
              <span id="color-value">#4fd1ff</span>
            </span>
          </label>

          <label>
            Rotation speed
            <span class="control-row">
              <input id="speed-input" type="range" min="0" max="200" step="1" value="55">
              <output id="speed-output" for="speed-input">55%</output>
            </span>
          </label>

          <div class="toggle-grid" role="group" aria-label="Render toggles">
            <label class="checkbox-label">
              <input id="rotate-input" type="checkbox" checked>
              Auto rotate
            </label>
            <label class="checkbox-label">
              <input id="wireframe-input" type="checkbox">
              Wireframe
            </label>
          </div>

          <div class="button-row">
            <button id="regenerate-button" type="button">Regenerate</button>
            <button id="reset-button" type="button">Reset view</button>
          </div>

          <dl class="mesh-stats" aria-label="Current mesh statistics">
            <div>
              <dt>Vertices</dt>
              <dd id="vertex-count">0</dd>
            </div>
            <div>
              <dt>Triangles</dt>
              <dd id="triangle-count">0</dd>
            </div>
          </dl>

          <p class="hint">
            Drag the canvas to adjust the view. Scroll or pinch to zoom.
          </p>
        </aside>

        <div class="viewport-card">
          <canvas id="solid-canvas" aria-label="Generated 3D solid preview"></canvas>
          <div id="status-panel" class="status-panel" role="status" aria-live="polite"></div>
          <noscript>
            <div class="status-panel status-panel--error">
              JavaScript is required to render this WebGL demo.
            </div>
          </noscript>
        </div>
      </section>
    </main>
  </body>
</html>

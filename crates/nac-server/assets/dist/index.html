<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the theme before styles or React load to avoid a light/dark flash.
      (() => {
        const key = "nac-theme";
        const allowed = ["light", "dark", "system"];
        let theme = "system";
        try {
          const saved = localStorage.getItem(key);
          if (saved && allowed.includes(saved)) theme = saved;
        } catch {
          // Storage can be unavailable in privacy-restricted browsing contexts.
        }
        const resolved =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        const root = document.documentElement;
        root.dataset.theme = resolved;
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
    <!-- Referenced from `src/` rather than a `public/` copy: the embedded server
         serves only `/assets/*`, so an icon at the dist root would 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/dist/assets/favicon-BDhzHmjC.svg"
    />
    <title>Telos</title>
    <script type="module" crossorigin src="/assets/dist/assets/index-HojwZliq.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/dist/assets/rolldown-runtime-hePW80VL.js">
    <link rel="stylesheet" crossorigin href="/assets/dist/assets/index-BZh2ItB0.css">
